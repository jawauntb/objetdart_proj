# room-spec.schema.yaml — the M2 contract of docs/plans/object-compiler.md
#
# JSON Schema, YAML-serialised. The coarsest specification that, together with
# three LLM-filled creative slots (shader body, domain law, verb wiring),
# deterministically produces the file shape of a post-consolidation room:
#
#   src/rooms/<key>/room.config.ts       ← from placement, palette, cluster, guide
#   src/app/<key>/page.tsx                ← from key + ambient_profile
#   src/app/<key>/layout.tsx              ← template constant
#   src/components/<Room>.tsx             ← shell wiring + verb_intent (LLM)
#   src/lib/<domain>.ts                   ← domain_intent (LLM)
#   scripts/test-<domain>.mjs             ← derivable from domain_lib
#   src/lib/room-registry.ts (patch)      ← key, creates, keeps, exempt
#   src/rooms/index.ts (patch)            ← one import line
#
# Field names are the CONTRACT. Renaming a field breaks every spec that
# authored against it, so `key`, `placement`, `cluster`, `noun`, `verbs_answered`
# and the three intent slots stay verbatim. Additive change only.
#
# The fields that a good agent given ONLY this spec cannot recover — the shader
# strings, the physics pure functions, the per-verb wiring — are named as
# `*_intent` here and described as briefs. See object-compiler/schema/README.md
# for the reason those three are LLM slots and the rest deterministic.

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://objetdart/object-compiler/room-spec.schema.yaml"
title: "Room Spec"
description: >
  The one paragraph of intent, structured. A `spec.yaml` valid against this
  schema is enough — together with the shared-system reference at
  `object-compiler/reference/` — to produce a room that passes
  `test:room-contract`, `test:routes`, `test:paint`, `test:guide`, and
  `test:scene`.

  The three LLM slots (`shader_intent`, `domain_intent`, `verb_intent`) are
  the per-room briefs the compiler hands to the slot-filler. The optional
  `visual_style` block sits alongside them as *design context*: a structured
  picture of what the room should look like — composition, subject, form
  language, motion character, palette registers by function, references,
  banned forms, mood, gesture-feedback style. When present it does not
  replace `shader_intent`; it hands the shader author the visual vocabulary
  the brief assumes. `slot-shader.md` (and, where useful, `slot-verbs.md`)
  SHOULD consume it. Older specs without a `visual_style` block still
  compile — the field is optional for backward compat until it is filled in
  from the landed screenshots.

  The optional `life` block encodes the room's answer to AGENTS.md §"The
  room quality bar" items 3 (make and unmake), 5 (alive at rest), and 6
  (two senses in the same frame — haptics on every meaningful act). Where
  `shader_intent` says what the room LOOKS like and `domain_intent` says
  what its physics ARE, `life` says how the room feels between and during
  interactions: what population lives here and how it is born and retired,
  what the material does on the shared 7s breath when no one is touching
  it, what a glimmer looks like after ~20s of idle, and which haptic
  pattern (from `src/lib/haptics.ts`) fires for each verb the room
  answers. If `life` is present, the compiler will require corresponding
  calls in the generated room (uBreath, haptics.<pattern>,
  createIdleWriter, SceneObjectSpec) — see scripts/test-room-quality.mjs
  for the mechanical checks. Older specs without a `life` block still
  compile — the field is optional for backward compat until it is filled
  in from the merged room.

type: object
additionalProperties: false
required:
  - key
  - placement
  - sigil
  - desc
  - cluster
  - ambient_profile
  - invariant
  - material
  - noun
  - domain_lib
  - palette
  - verbs_answered
  - guide
  - shader_intent
  - domain_intent
  - verb_intent

properties:

  # ——— identity ————————————————————————————————————————————————————

  key:
    type: string
    description: >
      Registry key. Kebab-case, three to sixteen letters, must equal the
      folder name at `src/rooms/<key>/` and the route segment. Also the
      guide entry key and the screenshot filename (`public/guide/<key>.jpg`).
    pattern: "^[a-z][a-z0-9-]{2,15}$"

  component_name:
    type: string
    description: >
      PascalCase name of the component file at
      `src/components/<component_name>.tsx`. Optional — the compiler
      defaults to a straight `capitalize(key)`, which is correct for
      most rooms. Every post-consolidation example overrides this
      with a richer concept name (soil → `SoilGround`, atmosphere →
      `AirColumn`, solar → `SolarSystem`, planets → `PlanetForge`,
      galaxy → `GalaxyArms`), so overriding is the norm rather than
      the exception here.
    pattern: "^[A-Z][A-Za-z0-9]{2,31}$"

  # ——— cosmology ———————————————————————————————————————————————————

  placement:
    description: >
      Where the room sits on the quark→manifold axis. Either the primary
      resident of a band, or a seat inside a peer circle. `band` names
      exactly one `SCALE_BANDS` entry; `circle` names one `PEER_CIRCLES`
      ring. Exempt rooms (laws, lenses, reading surfaces) are not written
      by this compiler — they lack the material a spec describes.
    oneOf:
      - type: object
        additionalProperties: false
        required: [kind, band]
        properties:
          kind:
            const: band
          band:
            type: string
            description: >
              A band id from `src/lib/scale.ts` `SCALE_BANDS`: one of
              `quanta`, `quarks`, `nucleons`, `atoms`, `molecules`,
              `organics`, `dna`, `organelles`, `cells`, `tissue`, `drop`,
              `flowers`, `birds`, `coast`, `olympus`, `atmosphere`,
              `atlas`, `earth`, `planets`, `solar`, `stars`, `galaxy`,
              `space`, `beyond`, `manifold`. The band's `route` must
              point at `/<key>`, or that link is set in the same PR.
            enum:
              - quanta
              - quarks
              - nucleons
              - atoms
              - molecules
              - organics
              - dna
              - organelles
              - cells
              - tissue
              - drop
              - flowers
              - birds
              - coast
              - olympus
              - atmosphere
              - atlas
              - earth
              - planets
              - solar
              - stars
              - galaxy
              - space
              - beyond
              - manifold
      - type: object
        additionalProperties: false
        required: [kind, circle, band, label]
        properties:
          kind:
            const: peer
          circle:
            type: string
            description: >
              Peer-circle id from `src/lib/peers.ts` `PEER_CIRCLES`: one
              of `sky`, `hearth`, `peak`, `shore`, `meadow`, `cabinet`.
              A new ring is a cosmology decision — never a typo, never
              introduced by the compiler.
            enum: [sky, hearth, peak, shore, meadow, cabinet]
          band:
            type: string
            description: >
              The band the seat physically sits in (same list as the
              `band` placement's `band`).
          label:
            type: string
            description: >
              How the ring names this seat — the string a peer twist
              shows and the dropdown lists.
          ringAfter:
            type: string
            description: >
              The peer key this seat sits after in the ring. Pins ring
              order deterministically so it never depends on import
              order. Omitted only for the ring's first seat.

  sigil:
    type: string
    description: >
      `RouteSigilKind` glyph the header dropdown and the home gallery
      draw. One of the values `RouteSigil` actually renders in
      `src/components/RouteSigil.tsx` — do not invent new sigils here.
    enum:
      - atlas
      - tide
      - waves
      - storm
      - clouds
      - aphros
      - fire
      - earth
      - growth
      - stars
      - solar
      - signal
      - plasma
      - pulse
      - charts
      - watch
      - archive
      - kept
      - colophon

  icon_kind:
    type: string
    description: >
      `SiteIconKind` used for the favicon, apple-touch icon and
      opengraph card. Optional — the compiler falls back to `sigil`
      when omitted, which is correct for four of the five example
      rooms. Name it explicitly only when the icon should differ from
      the header glyph (as in solar, where the sigil is a heliocentric
      mark but the icon reads as `stars`).
    enum:
      - aphros
      - archive
      - atlas
      - beyond
      - charts
      - circularity
      - clouds
      - coin
      - colophon
      - compare
      - earth
      - fire
      - flowers
      - growth
      - home
      - jewel
      - kept
      - light
      - tourbillon
      - ocean
      - plasma
      - pretext
      - pulse
      - reading
      - signal
      - sine
      - stars
      - storm
      - tide
      - time
      - watch
      - waves

  cluster:
    type: string
    description: >
      Home-gallery grouping (`SiteRouteCluster` in `src/rooms/types.ts`).
      Every post-consolidation room the compiler was trained on is
      `nature`; the other three exist for older families and are legal
      but rare.
    enum: [nature, field, water, mechanism]

  desc:
    type: string
    description: >
      One lowercase line for the header dropdown and for
      `icon.description` — always the same string. Distinct from
      `guide.title`, which may drop qualifiers the dropdown keeps (as
      in solar: dropdown "the system assembled · kept on real time",
      guide title "the system assembled").

  chrome:
    type: object
    additionalProperties: false
    description: >
      What `<RoomShell>` mounts for this room. Optional — the compiler
      defaults to `{ travel: true, peers: true }`, which is right for
      every post-consolidation example. Set `travel: false` only when
      the room owns pinch itself (as `/beam` does, pulling its binary
      suns apart).
    properties:
      travel:
        type: boolean
        description: >
          Pinch-owned scale travel. Default true; false while the room
          owns pinch.
      peers:
        type: boolean
        description: >
          Lateral peer ring. Default true; no-ops when the route has no
          circle.

  dark:
    type: boolean
    description: >
      Dark chrome for this route and its children. All five example
      rooms are true.
    default: true

  home_priority:
    type: integer
    description: >
      Home-gallery weight when the room earns a larger tile. Optional.
    minimum: 1
    maximum: 12

  # ——— sound bed ————————————————————————————————————————————————————

  ambient_profile:
    type: string
    description: >
      Argument the room's `page.tsx` passes to
      `getFieldAudio().setAmbientProfile(...)`. Names one of the beds
      defined by `AmbientProfile` in `src/lib/audio.ts`. The band's own
      register (`spectralRegisterFor(s)`) is still applied on top;
      this only picks the timbre of the ambient bed.
    enum:
      - ocean
      - aphros
      - tide
      - waves
      - watch
      - pretext
      - storm
      - wind
      - fire
      - earth
      - cosmic
      - monitor
      - electric
      - garden
      - clockwork
      - archive
      - entry
      - atlas
      - colophon
      - compare
      - kept
      - reading
      - signal
      - vacuum
      - beyond
      - circularity
      - flowers
      - light
      - sine
      - time
      - silent

  # ——— persistence ————————————————————————————————————————————————————

  storage_key:
    type: string
    description: >
      The `localStorage` key `createIdleWriter` writes the room's kept
      state under. Convention `objetdart:<key>:v<n>`. Optional — a room
      that keeps nothing of its own (its persistence rides through the
      shared `world.ts` bus) may omit this; the compiler will emit
      `keeps: null` in the registry.
    pattern: "^objetdart:[a-z0-9-]+:v[0-9]+$"

  # ——— material ————————————————————————————————————————————————————————

  invariant:
    type: string
    description: >
      One-line technical description of the room's invariant object —
      the small deterministic thing every representation is a lens over.
      This is the sentence that opens the header doc of `src/lib/<domain>.ts`.
      Example: "a set of orbital elements per body under Kepler's law."

  material:
    type: string
    description: >
      How the field is painted. `shader` is a fullscreen fragment
      program with no 2D overlay; `2d-over-shader` adds a thin 2D pass
      for the hand's own marks and the lens. All five post-consolidation
      rooms are `2d-over-shader`; a pure shader room is legal but rare.
    enum: [shader, "2d-over-shader"]

  noun:
    type: string
    description: >
      The countable thing a dwell creates. Singular, lowercase, no
      article. Written verbatim into the `creates:` field of the room's
      `room-registry.ts` entry (prefixed with an article there).

  # ——— domain library ——————————————————————————————————————————————————

  domain_lib:
    type: object
    additionalProperties: false
    required: [name, invariant_type]
    description: >
      The pure physics module the room's laws live in. Owned entirely
      by the LLM's `domain_intent` slot; the schema only names it and
      classifies the shape of its invariant.
    properties:
      name:
        type: string
        description: >
          Bare filename stem in `src/lib/`. The compiler writes
          `src/lib/<name>.ts` and pairs it with `scripts/test-<name>.mjs`.
        pattern: "^[a-z][a-z0-9]{1,23}$"
      invariant_type:
        type: string
        description: >
          Which shape of invariant the domain speaks. This picks the
          test skeleton and the retrieval bank slice for the domain
          slot. `latent` — a compact vector decoded into a world.
          `ledger` — a currency held in a few pools that only moves
          between them. `lattice` — a discrete crystal-like grid with
          allowed transitions. `field` — a continuous scalar or vector
          field over a region. `flock` — many independent agents under
          a shared law. `column` — a vertical profile integrated in
          closed form. `orbit` — orbital / phase-space elements per
          body. `chain` — a linear polymer / sequence with local rules.
        enum: [latent, ledger, lattice, field, flock, column, orbit, chain]

  # ——— palette ————————————————————————————————————————————————————————

  palette:
    type: object
    additionalProperties: false
    required: [bg, bg2, glow, accent, accent2, ink]
    description: >
      Six hex colours used by the favicon, the apple-touch icon, the
      opengraph card, the manifest — and, by convention, the shader's
      base colour registers. Set once, threaded through
      `RoomManifest.icon`.
    properties:
      bg:
        type: string
        description: page background (paper of the room)
        pattern: "^#[0-9a-fA-F]{6}$"
      bg2:
        type: string
        description: secondary background — the deeper card / horizon
        pattern: "^#[0-9a-fA-F]{6}$"
      glow:
        type: string
        description: the warm accent, sigils, the candle in the corner
        pattern: "^#[0-9a-fA-F]{6}$"
      accent:
        type: string
        description: primary accent — mid-value cool or warm
        pattern: "^#[0-9a-fA-F]{6}$"
      accent2:
        type: string
        description: secondary accent — supporting midtone
        pattern: "^#[0-9a-fA-F]{6}$"
      ink:
        type: string
        description: primary text and mark colour
        pattern: "^#[0-9a-fA-F]{6}$"

  # ——— gesture answers —————————————————————————————————————————————————

  verbs_answered:
    type: array
    description: >
      Which global verbs the material answers. Names from the fixed
      grammar (`docs/gesture-grammar.md` §5). Any verb the material
      genuinely cannot express carries an entry in `exempt` on the
      generated `room-registry.ts` row instead — the compiler asks for
      that reason as part of the slot brief. An empty array is legal
      only for a declared reading surface, which is out of scope for
      this schema.
    minItems: 3
    items:
      type: string
      enum:
        - tap
        - dwell
        - ceremony
        - drag
        - flick
        - twist
        - twist3
        - tap3
        - drag3
        - hold3
        - scrub
        - drum
        - arrows
        - tilt
        - shake
        - knock
        - flip

  # ——— guide entry ——————————————————————————————————————————————————————

  guide:
    type: object
    additionalProperties: false
    required: [title, essence, moves]
    description: >
      The room's field-guide entry. Written verbatim into
      `RoomManifest.guide`. The moves array is exhaustive per grammar;
      the finds array holds the rewards a patient hand discovers; keeps
      names what persists between visits (empty string if nothing does).
    properties:
      title:
        type: string
        description: one line, lowercase, matches the room's own line
      scale:
        type: string
        description: >
          Where it sits on the quark→manifold axis, in the room's own
          words. Optional — bands render a default from `SCALE_BANDS`
          when omitted, but every example spec includes it.
      essence:
        type: string
        description: >
          One paragraph, three to six sentences, no marketing verbs,
          no emoji. The one place the site describes what this room IS.
      moves:
        type: array
        description: >
          Every gesture the material answers, each reading "verb →
          answer". Not for beginners — for the hand that has already
          arrived. One line per verb; group verbs that answer the same
          motion.
        minItems: 3
        items:
          type: string
      finds:
        type: array
        description: The non-obvious rewards a patient hand finds.
        items:
          type: string
      keeps:
        type: string
        description: What the room remembers between visits.

  # ——— visual style (design context for the shader slot) ——————————————

  visual_style:
    type: object
    additionalProperties: false
    description: >
      Design brief for what the room SHOULD LOOK LIKE — the picture-diff
      between a landed `public/guide/<key>.jpg` and the shader that produced
      it, structured. `shader_intent` remains the specific, per-room brief;
      this block is the DESIGN CONTEXT the brief assumes: composition,
      subject, form language, motion character, palette registers by
      function, reference notes, banned forms, mood, and gesture-feedback
      style. Every field is optional so existing specs keep compiling until
      the block is filled in from the landed screenshot; when present, the
      slot-shader prompt (and, where relevant, slot-verbs) SHOULD consume
      it. All fields carry pictorial vocabulary — nouns and adjectives a
      designer would say aloud — not technical GLSL.
    properties:
      composition:
        type: string
        description: >
          How the room is framed. `side-section` shows a vertical slice
          (soil is a side-section cutaway; atmosphere is a side-section
          ambient column). `top-down` looks down (galaxy). `first-person`
          places the viewer inside. `ambient-column` is a full-viewport
          vertical field with no framing chrome. `cutaway` opens a section
          through a solid. `silhouette` shows only the outline against a
          field.
        enum:
          - side-section
          - top-down
          - first-person
          - ambient-column
          - cutaway
          - silhouette
      subject:
        type: string
        description: >
          One-line noun phrase for what the shader is depicting — the
          thing a viewer would name if asked what they see. E.g. "a hand's
          width of wet ground with a small pool over an aquifer", "a
          heliocentric map of orbits on paper".
      form_language:
        type: array
        description: >
          How the material is painted, as a small set of vocabulary tokens
          a shader author would recognise. Multiple values allowed (a
          watercolor SDF room is legal). Tokens: `watercolor` (soft
          bleeds, wet-into-wet), `hand-painted` (visible brush and grain),
          `ink-line` (thin dark hairlines), `SDF` (signed-distance
          primitives with anti-aliased edges), `value-noise-FBM` (layered
          value noise), `ray-marched` (volumetric marching through a
          field), `point-cloud` (many small marks), `ribbon-flow` (long
          streaming curves), `stipple` (dotted texture).
        items:
          type: string
          enum:
            - watercolor
            - hand-painted
            - ink-line
            - SDF
            - value-noise-FBM
            - ray-marched
            - point-cloud
            - ribbon-flow
            - stipple
      motion_character:
        type: string
        description: >
          The shader's temporal character. `still` sits and waits.
          `breathing` moves on the site's 7s clock (the default for most
          rooms). `drifting` moves without an obvious period. `pulsing`
          has a repeating beat. `cyclic` runs a longer named loop (a
          year, a tide). `ballistic` fires in discrete bursts (geyser's
          erupt phase). `stochastic` is noise-driven, no clock.
        enum:
          - still
          - breathing
          - drifting
          - pulsing
          - cyclic
          - ballistic
          - stochastic
      registers:
        type: array
        description: >
          The palette registers by function — one string per assignment,
          each naming what a hex slot ACTUALLY PAINTS in this room.
          Bridges the abstract palette (`bg`, `bg2`, `glow`, `accent`,
          `accent2`, `ink`) to the concrete registers the shader draws.
          E.g. "deep water: bg→bg2", "mineral bloom: accent2",
          "sunlit highlight: glow", "root/hypha line: accent2 at 0.6α".
          Arrow (→) permitted for gradients.
        items:
          type: string
      reference_notes:
        type: array
        description: >
          Concrete visual references a designer would name aloud. Free
          text, one image or comparison per entry. E.g. "like a wet
          cross-section of clay in a jar; the aquifer register echoes
          the ocean's depth gradient", "reads as an ink-line orrery on
          warm paper". Not for URLs — these are described references,
          the kind a shader author carries in their head.
        items:
          type: string
      banned_forms:
        type: array
        description: >
          The explicit no-fly list for this room. Always includes at
          least the AGENTS.md room-quality bar (no `createRadialGradient`,
          no per-frame `shadowBlur`, no `ctx.filter` blur, no per-object
          gradient pass, no allocation in the RAF loop). May add
          room-specific negatives — "no cartoon puffiness on the plume",
          "no visible seam between layers", "no rainbow gradient" — where
          a landed screenshot exposed the failure mode.
        items:
          type: string
      mood:
        type: string
        description: >
          One-line felt sense — the emotional register the visual should
          land in. "contemplative and low" / "anticipatory then eruptive"
          / "buoyant, weightless, held". Not a marketing verb; the
          adjective a visitor would offer unprompted after a minute in
          the room.
      gesture_feedback_style:
        type: string
        description: >
          How touch shows up in the visual — bridges the shader to the
          verb handlers. "ripple wavefront that decays radially", "burn-in
          halo that fades over 3s", "displacement wave under the surface",
          "brush-mark that stays until the ceremony hold clears it".
          This tells the slot-verbs author what visual language the
          shader will accept for `stir()`, `press()`, `plant()`, etc.

  # ——— the three LLM slots ————————————————————————————————————————————

  shader_intent:
    type: string
    description: >
      A brief for the shader body. Paragraph form, concrete enough that
      a good agent reading ONLY this — plus the retrieval bank — could
      produce a fragment shader whose look and feel matches the merged
      room. Say what layers are stacked (depth gradient, noise, warp,
      caustics), what the visitor's hand does to those layers (ripple
      injection, warp, extinction), what the palette means physically
      (this glow is a temperature, this accent is an optical depth),
      and which representation is INVERTIBLE (the sky's colour is the
      column's weight; the tone's pitch is the orbital frequency). The
      shader carries the room's look but not its laws — the laws live
      in `domain_intent`.

  domain_intent:
    type: string
    description: >
      A brief for the pure physics module (`src/lib/<domain_lib.name>.ts`).
      Paragraph form, concrete enough that a good agent could produce a
      module whose exports match the invariant the room reads back off
      the material. Say what the invariant is (a ledger of five pools;
      a vector of orbital elements per body; a compact latent per
      world); what the closed-form advance is (a linear cascade solved
      exactly; Kepler's equation solved to tolerance; a two-exponential
      decay); what the loading map into audio is and how to invert it
      (litter sets centroid, mineral sets ring — `mixFromTimbre` reads
      it back); and which constants carry the physics (Q₁₀ for
      decomposition; the sea-level pressure; the flat rotation curve).
      No DOM, no audio, no `Math.random`, no `Date.now`.

  verb_intent:
    type: string
    description: >
      A brief for how each verb in `verbs_answered` maps into the
      domain physics. Paragraph form, concrete enough that a good agent
      could write the `attachGestures`-fed handlers whose failing
      would be a bug the room's `test-<domain>.mjs` catches. Say what
      tap does (sounds an object; on empty ground stirs the field);
      what dwell does (grows the reserve, planted at ceremony); how
      duration deepens and how intensity scales, so nothing fires
      identically at 900ms and 2400ms; how the three-finger world-law
      verbs write into the domain state (weather is warmth-across and
      rain-down; season winds τ; dilation slows the room clock while
      held). Name the pure functions the handlers call, not a control
      panel.

  # ——— the "alive at rest" / "make and unmake" / "two senses" bar ————
  # This block structures AGENTS.md §"The room quality bar" items 3, 5 and 6.
  # Every top-level field is optional; the block itself is optional. When it
  # is present the compiler (via scripts/test-room-quality.mjs) requires the
  # room to actually call uBreath, haptics.<pattern>, createIdleWriter and
  # SceneObjectSpec — so a `life:` block IS a promise, not decoration.

  life:
    type: object
    additionalProperties: false
    description: >
      The felt-bar contract: a room's answer to AGENTS.md's non-negotiable
      items 3 (make and unmake — countable objects with a real lifecycle),
      5 (alive at rest — the 7s breath, glimmers after 20s idle), and 6
      (two senses in the same frame — a haptic pattern on every meaningful
      act). Where `shader_intent` names the look and `domain_intent` names
      the physics, `life` names what the room DOES when nobody is watching
      and what it FEELS like in the palm when someone is. All fields are
      optional; the block itself is optional so older specs still compile.
      Present here, the compiler treats each field as a requirement its
      test hooks will check.

    properties:

      # ~~~ item 3: make and unmake ~~~
      population:
        type: object
        additionalProperties: false
        required: [objects]
        description: >
          The countable inhabitants of the room. Omit `life.population`
          entirely for the rare room that has no countable objects (a
          reading surface, or a point-cloud where individual objects are
          not the addressable unit — /galaxy's 180,000 stars are drawn as
          a field, not a population in the "dwell creates one" sense).
          When present, `objects` MUST be non-empty (the schema enforces
          this): every room with countable objects should account for
          them here even if the room today fails part of the lifecycle.
        properties:
          objects:
            type: array
            minItems: 1
            description: >
              One entry per addressable kind of countable object. Most
              rooms have exactly one entry (soil's `root`, spring's
              `seep`); a few have two (soil declares roots AND fungi as
              two shapes of the same organism kind, or a room like
              atmosphere has parcels-in-flight AND lanterns-kept).
            items:
              type: object
              additionalProperties: false
              required:
                - noun
                - max_count
                - state_shape
                - lifecycle
                - persistence
                - creates_via_verb
                - retires_via
                - implementation_hint
              properties:
                noun:
                  type: string
                  description: >
                    Singular, lowercase, no article. Prefer nouns that
                    already appear in the room's `guide.moves` — the
                    written grammar and the schema should match. If this
                    room's top-level `noun` names one of these, prefer
                    the same string here.
                max_count:
                  type: integer
                  minimum: 1
                  description: >
                    Population cap — the constant the room's component
                    or its `src/lib/<domain>.ts` reads to slice its
                    array before writing to storage. Names the same
                    constant as `MAX_LANTERNS`, `MAX_SEEPS`,
                    `MAX_WORLDS`, `MAX_ORGANISMS` etc. Unbounded
                    populations are a bug — no `max_count` cap allowed.
                state_shape:
                  type: string
                  description: >
                    One-line description of the per-object state
                    vector. E.g. "id, nx, ny, throat, sealed" for a
                    seep, or "id, orbital elements (a, e, incl, omega,
                    phase), mass, seed" for a body.
                lifecycle:
                  type: string
                  description: >
                    One-line description of the object's arc:
                    "born under dwell → growing → sealed by ceremony
                    → retiring over one breath". Prefer this exact
                    four-stage grammar; deviate only when the room
                    genuinely does not follow it (e.g. a lantern that
                    never retires — call that out truthfully).
                persistence:
                  type: string
                  enum: [world, LetGo, localStorage, ephemeral]
                  description: >
                    Which bus persists the population between visits.
                    `world` — the shared `src/lib/world.ts` naturals
                    registry (atmosphere's lanterns, waves' leaves).
                    `LetGo` — kept via createIdleWriter, cleared by
                    the shared <LetGo> button (rocks' stones, soil's
                    organisms, planets' worlds). `localStorage` — a
                    room-owned key that is not gated by <LetGo>
                    (rare, and probably a smell). `ephemeral` — dies
                    with the tab (embers in /fire, pulses in /waves;
                    intentional for fast-decay populations).
                creates_via_verb:
                  type: string
                  description: >
                    Which gesture verb births a new instance. Almost
                    always `dwell` (a press that grows the reserve
                    while held). Sometimes `tap` (a strike that seeds
                    one immediately) or `ceremony` (a hold that only
                    plants at tier 3). Must be a verb in
                    `verbs_answered`.
                retires_via:
                  type: array
                  minItems: 1
                  items:
                    type: string
                  description: >
                    Verbs that retire an instance, in order of
                    everyday reach. Typical value: `["ceremony",
                    "LetGo"]` (ceremony over an existing instance is
                    its touch-reachable delete; LetGo is the
                    whole-population clear). A `flick` that tears one
                    apart also counts. Every entry must be a verb the
                    room answers OR the literal string `LetGo`.
                implementation_hint:
                  type: string
                  description: >
                    Which shared shape the object rides. `SceneObjectSpec`
                    (declared through `src/lib/scene/object.ts` — the
                    typed grammar-answering path), `inline array` (the
                    room manages a plain array on its own — older
                    rooms), `world.ts registry` (persistence through
                    the shared naturals bus). This is a promise about
                    HOW the population is stored, not just that it is.

      # ~~~ item 5: alive at rest ~~~
      breath:
        type: object
        additionalProperties: false
        description: >
          What visibly moves on the shared 7s breath when nobody is
          touching the room. AGENTS.md §"quality bar" item 5.
        properties:
          period_seconds:
            type: number
            minimum: 0.5
            description: >
              Breath period in seconds. Default 7 to match the site's
              shared LFO (`src/lib/timing.ts` `getBreath()` / the shell's
              `uBreath` uniform). Override only when the material's
              rhythm is genuinely different (a room on the pulse of a
              heartbeat, a room on the tick of a clock — rare).
            default: 7
          reads:
            type: array
            minItems: 1
            items:
              type: string
            description: >
              What the shader or component reads from the breath —
              e.g. "uBreath uniform" (fragment shader), "u_breath
              uniform" (older shader), "getBreath()" (from
              `src/lib/timing.ts`), "clocks.breath" (from the shell's
              clock pack). At least one must be named.
          behavior_at_rest:
            type: string
            description: >
              One-line description of what the visitor sees change when
              nothing is being touched. "the sky's colour widens and
              narrows by ±0.14 as the column breathes"; "the polish
              highlight brightens and dims by 6%"; "every world's
              corona swells and settles by ±14%". Concrete, in the
              room's own material vocabulary.

      glimmer:
        type: object
        additionalProperties: false
        description: >
          The discovery flare that AGENTS.md pins as the ONLY explanation
          the site is allowed — a physical event, never text, that lights
          up after roughly 20s of quiet.
        properties:
          after_idle_ms:
            type: integer
            minimum: 1000
            description: >
              Idle threshold in milliseconds before the glimmer fires.
              Default 20000 per AGENTS.md; override only for rooms with
              a genuinely different rhythm.
            default: 20000
          visual:
            type: string
            description: >
              One-line description of what a glimmer looks like in this
              material. "a single seep breathes a wider ring, alone";
              "one stone's facet catches the raking light for half a
              breath"; "a passing bird calls once, then falls silent".
              Not "a small animation" — the specific event.

      # ~~~ item 6: two senses — the haptics grammar ~~~
      haptics_grammar:
        type: object
        additionalProperties: false
        description: >
          For each verb the room implements, the haptic pattern from
          `src/lib/haptics.ts` that fires. The keys named here MUST be a
          subset of `verbs_answered` — you cannot claim a haptic for a
          verb the room does not answer. Values are pattern names from
          `haptics.ts` (`ripple`, `roll`, `chop`, `tap`, `storm`,
          `detent`, `crossing`, `lens`, `bloom`) or the literal `null`
          when a verb genuinely has no haptic. `tap` uses a small
          hard-typed enum because the choice among ripple/roll/chop/tap
          /storm is the most consequential single call; the other verbs
          take a string so any current or future haptics export is
          legal, with the convention that unknown values fail
          `test-room-quality.mjs`.
        properties:
          tap:
            oneOf:
              - type: "null"
              - type: string
                enum: [ripple, roll, chop, tap, storm]
          dwell:     { type: [string, "null"] }
          ceremony:  { type: [string, "null"] }
          drag:      { type: [string, "null"] }
          flick:     { type: [string, "null"] }
          twist:     { type: [string, "null"] }
          twist3:    { type: [string, "null"] }
          tap3:      { type: [string, "null"] }
          drag3:     { type: [string, "null"] }
          hold3:     { type: [string, "null"] }
          scrub:     { type: [string, "null"] }
          drum:      { type: [string, "null"] }
          knock:     { type: [string, "null"] }
          shake:     { type: [string, "null"] }
          tilt:      { type: [string, "null"] }
          flip:      { type: [string, "null"] }
          arrows:    { type: [string, "null"] }

      # ~~~ integration checkpoints — the joins between the above ~~~
      make_unmake:
        type: object
        additionalProperties: false
        description: >
          Two questions the schema poses so a spec cannot fudge item 3.
          Answer them truthfully — a spec whose room fails these has a
          real bug worth naming.
        properties:
          letgo_clears_population:
            type: boolean
            description: >
              True if the shared <LetGo> button empties this room's
              population; false if <LetGo> only ends the
              ceremony/current-hold and long-lived instances persist
              past it. AGENTS.md item 3 requires "an emptied room stays
              empty" — a false value here is worth flagging as a
              real-room bug in the spec's comment, not silently
              accepted.
          ceremony_is:
            type: string
            description: >
              One-line description of the room's solemn act — AGENTS.md
              calls it "the one solemn act", and the room needs one.
              "planting a life where the finger is"; "giving a candle
              to the wind as a lantern, kept"; "the geode opens and its
              lining faces out". Named here so the schema author has
              actually thought about it.
