# solar — the system assembled, kept on real time
#
# Round-trip-derived from src/rooms/solar/room.config.ts and src/lib/orbits.ts.
# The only field where the sigil and the icon kind disagree in the five example
# rooms: the header glyph is heliocentric (`solar`), the favicon/OG reads as
# `stars`.

key: solar
component_name: SolarSystem

placement:
  kind: band
  band: solar

sigil: solar
icon_kind: stars
desc: "the system assembled · kept on real time"
cluster: nature
dark: true
ambient_profile: cosmic
storage_key: "objetdart:solar:v1"

invariant: >
  a set of orbital elements per body — semi-major axis a, eccentricity e,
  inclination, argument of periapsis, and phase — under one law (Kepler's).
  every voice, arc, and precession is a lens over the same five numbers.

material: 2d-over-shader
noun: body

domain_lib:
  name: orbits
  invariant_type: orbit

palette:
  bg: "#06080c"
  bg2: "#1a1426"
  glow: "#c8732a"
  accent: "#f2eee6"
  accent2: "#7cac96"
  ink: "#f4efe4"

visual_style:
  composition: top-down
  subject: "the solar system seen from above the ecliptic — a granulated sun, six thin orbit ellipses, small lit planetary discs"
  form_language: [SDF, value-noise-FBM, ink-line, hand-painted]
  motion_character: cyclic
  registers:
    - "deep space between the stars — via bg"
    - "the zodiacal dust plane and the outer vignette — via bg2"
    - "the sun's granulated corona and hot inner worlds — via glow"
    - "paper the notation lens is drawn on, and the lit face of a body — via accent"
    - "cool outer bodies and the pale halo of the milky band — via accent2"
    - "the lens ink and the thin orbit rings — via ink"
  reference_notes:
    - "an old orrery diagram, but with a real limb-darkened granulated sun instead of a brass ball"
    - "a plate in a Kepler treatise — thin ellipses, dots on them, one bright centre"
    - "a milky-way band leaned across the frame as a rotated fbm ridge, never as a stamp"
  banned_forms:
    - "no createRadialGradient, no shadowBlur per AGENTS.md"
    - "no first-person or side-section — the ecliptic is looked down onto, then leaned"
    - "no drawn spiral for the milky band; no sprite planets — every body is an instanced SDF lit sphere"
  mood: "quiet clockwork; the room keeps ticking on real elapsed time whether or not anyone is watching"
  gesture_feedback_style: "a tap flares a body and sounds its orbital frequency; a drag pulls its semi-major from the pointer's radius (the voice drops as Kepler demands); a held condensation grows a new world on the sky, released onto a clean circle"

verbs_answered:
  - tap
  - dwell
  - ceremony
  - drag
  - flick
  - twist
  - twist3
  - tap3
  - drag3
  - hold3
  - scrub
  - drum
  - arrows
  - tilt
  - shake
  - knock
  - flip

guide:
  title: "the system assembled"
  scale: "the solar band — between the planets and the stars"
  essence: >
    a small solar system that genuinely keeps orbiting while nobody watches —
    real elapsed time folded into kepler's clockwork in one closed-form step —
    and the worlds pull on each other while you do, so orbits precess, pairs
    lock into whole-number ratios, and what touches merges.
  moves:
    - "tap a world → it flares and sings its orbit; the tone's frequency is the orbital frequency, lifted whole into hearing"
    - "tap the sun → it answers with a low bell and a flare of its corona"
    - "tap open sky → the dust stirs and one low grain sounds"
    - "drag a world → the orbit follows the hand; pulled outward the voice falls, exactly as kepler demands"
    - "drag open sky → pitches the plane and sets it turning"
    - "hold open sky → a world condenses under the finger: the longer the hold the heavier it is, and the drift of the finger while held is the velocity it is let go with — still, and it lands on a clean circle"
    - "hold a world to the ceremony (~2.5s) → the sky gathers behind it — a grand conjunction that then shears open at each body's own rate"
    - "flick a world → throws it; a hard enough throw passes escape speed and the system lets it go for good"
    - "circle a finger along an orbit → traces it, carrying its body round with soft ticks"
    - "two-finger tap → steps the frame back, and lowers the notation lens if it is raised"
    - "three-finger tap → tutti: the whole chord at once, every interval a period ratio"
    - "three-finger drag → the law: across weighs the sun and the chord retunes; down slows or hastens the epoch"
    - "three-finger twist → winds the season, the sky sweeping through its year"
    - "three-finger hold → time dilates, deeper the longer it is held"
    - "twist two fingers → raises the notation lens: pitch as height, phase as position, eccentricity stretching each note-head, inclination leaning its stem; two-finger tap or escape lowers it"
    - "patter two hands → the dust answers between them"
    - "tilt → leans the ecliptic; shake → stirs the dust and jostles the wanderers; knock → the sun answers the door; face-down → night"
    - "arrows → choose a world and wind the days; enter → sounds the chosen one; held enter → the conjunction; backspace → throws it"
  finds:
    - "leave and come back: the planets keep to their courses on real elapsed time — a week away lands them exactly where a week puts them"
    - "the worlds pull on each other while you watch: orbits precess, a heavy one herds its neighbours, and two that touch become one"
    - "when two periods fall into a small whole-number ratio a thin line ties them and each answers the other at periapsis — the resonance is audible before it is visible"
    - "drag a world hard enough into the sun and its angular momentum is spent: it falls in and the sun takes it"
    - "the chord is the third law made audible: read any voice's frequency back and you have its orbit"
  keeps: "the epoch and every element — precessed orbits, planted worlds, their weights, the sun's own weight, and the pace of the days"

# ——— the three LLM slots ————————————————————————————————————————————————

shader_intent: >
  the field is deep space, seen from above the ecliptic. draw four layers:
  (1) a slow-drifting starfield in the background using value noise as a
  static-looking bed; (2) a thin dust disc — a soft ring integrated over the
  disc plane, whose brightness is the current mass reserve so `flick`ing a
  world into the sun visibly returns its mass here; (3) each body as an
  instanced SDF disc with a corona whose warmth is its distance from the sun
  (inner worlds hotter, outer cooler); (4) the sun itself as a larger SDF
  disc with a corona modulated by its own weight (which the world-law can
  change). ecliptic tilt (from `drag` on open sky) rotates the whole disc
  under a perspective transform. the 2D overlay carries the notation lens
  when raised: pitch as height, phase as position, eccentricity stretching
  the note-heads, inclination leaning the stems. dilation renders as a soft
  vignette over the sky. palette registers: `bg` is deep space, `bg2` is the
  dust plane, `glow` is the sun and hot inner worlds, `accent` is the paper
  the notation is drawn on, `accent2` is the outer cool ring, `ink` the
  lens's line colour. the visible invariant is the audible one: the chord
  the tap plays is the third law made rgb — the higher the tone, the tighter
  the orbit.

domain_intent: >
  write `src/lib/orbits.ts` around a `Body` type with `{ a, e, incl, omega,
  phase, mass, seed }` (5 elements + mass + seed). export `advance(bodies,
  dt, mu)` — no history replay: mean anomaly is linear in time, eccentric
  anomaly one bounded Kepler solve with a `KEPLER_TOL` of 1e-11. export
  `positionOf(body, sim_t, mu)` and `velocityOf(body, sim_t, mu)`. export
  `orbitalFrequency(body, mu)` and `semiMajorForFreq(freq, mu)` — pair
  inverse to it, because the load-bearing map (period → pitch, T² ∝ a³
  audible) is invertible or the room is not a map. export `mergeBodies(a,
  b)` — mass conserving, angular-momentum conserving. export `massForHold(ms)`
  as a saturating curve from `MASS_MIN` at 0ms to `MASS_MAX` at ceremony
  duration. export `perturbations(bodies, dt, mu)` — the linearised mutual
  pull that makes orbits precess and pairs lock into whole-number ratios;
  Keplerian drift is the truth and this is the perturbation on top of it.
  export `escapeSpeed(body, mu)` so `flick` can tell whether a throw leaves
  the system. constants at the top: `BASE_PERIOD_S = 540`, `MU_UNIT`,
  `MU_FACTOR_MIN/MAX` bounds for the world-law, `A_MIN/A_MAX` set by
  audibility (every reachable orbit must voice its true unclamped mapped
  frequency), `AUDIO_SCALE`, `PLANET_COUNT = 6`, `MAX_COMETS = 6`. no DOM,
  no audio, no `Math.random`, no `Date.now`; the epoch is passed in.

verb_intent: >
  `tap` on a body sounds its `orbitalFrequency` through the audio bus; tap
  on the sun rings a low bell whose frequency is set by the sun's current
  weight (`mu`); tap on open sky stirs the dust and pings one low grain.
  `dwell` on open sky condenses a body under the finger — held time buys
  mass via `massForHold`; the finger's drift during the hold is the launch
  velocity, so still means a clean circle. `ceremony` (held past ~2.5s) is
  the grand conjunction: the current phases are pulled to a common line and
  then released, so each body shears open at its own rate. `drag` on a body
  writes its `a` (semi-major) from the pointer's radius, and the voice's
  pitch drops as Kepler demands; `drag` on open sky pitches the ecliptic
  plane. `flick` gives a body a real throw; `escapeSpeed` decides whether
  it leaves the system for good. `scrub` (finger circling on an orbit)
  traces the orbit and carries its body round with soft ticks. `twist`
  (two-finger) raises the notation lens; `tap` with `fingers === 2` lowers
  it (stepBack). `tap3` (tutti) plays the whole chord at once — one voice
  per body simultaneously. `drag3` writes the world-law: horizontal
  component scales `mu` (weighing the sun; the chord retunes), vertical
  advances or retreats the epoch. `twist3` winds the season through the
  year. `hold3` slows the sim clock while held. `drum` (two hands
  alternating) makes the dust answer between them. the vessel: `tilt`
  leans the ecliptic through gravity, `shake` stirs the dust and perturbs
  each body's `e` and `omega` by a small amount, `knock` rings the sun,
  `flip` is night. `arrows` step between bodies; enter sounds the chosen
  one; held enter is the conjunction; backspace throws the chosen. every
  time constant in the handlers reads from a domain export or `gesture/core.ts`.
