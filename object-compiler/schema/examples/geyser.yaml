# /geyser — an intermittent water column, at the drop band, ringed with spring.
#
# Where /spring is a *steady seep* the aquifer breaches into the ground, a
# geyser is the drop-band's other face: a superheated aquifer under a narrow
# throat that fills, boils, and fires. The room is a *waiting-for-an-event*
# room. Between eruptions the pool sits calm and the ground breathes a low
# hiss; when the head times the temperature past the trigger, a ballistic
# column of water rides the pressure release into the air, then cools and
# begins refilling. Spring's invariant was H alone; geyser's is (H, T) — the
# thermal register is what turns a seep into a bomb.
#
# Placement: same drop band, same cabinet ring, just behind /spring so the
# twist order becomes … → /rocks → /soil → /spring → /geyser → /coin → … .
# A peer of the drop and of the spring beside it: same section-sized ground,
# but the water leaves it by shot rather than trickle. `ringAfter: spring`.
#
# The sigil is "growth" again — a growth glyph rings when the aquifer swells
# and sighs when it cools, so the mark reads correctly through the cycle. The
# "fire" sigil was tempting because eruption is a thermal event, but the
# geyser's whole invariant is the *cycle*, not the flame instant; growth is
# the honest read across the build-erupt-cool arc.

key: geyser

placement:
  kind: peer
  circle: cabinet
  band: drop
  label: "the geyser"
  ringAfter: spring

sigil: growth
desc: "the aquifer, timed and superheated"
cluster: nature
dark: true
home_priority: 9
ambient_profile: fire
storage_key: "objetdart:geyser:v1"

invariant: >
  a two-state thermal ledger — an aquifer head H(t) under a narrow throat and a
  temperature T(t) in the same column — with an eruption trigger E = H·T
  crossing a hysteretic threshold. between eruptions the room is a slow
  build: recharge lifts H, geothermal warmth lifts T; when E crosses upward
  the throat blows and a ballistic column Q_erupt fires, dumping heat and
  head into the air and the pool below. every glow, hiss, plume-height and
  bell is a lens over those two numbers and the phase they are in.

material: 2d-over-shader
noun: eruption

domain_lib:
  name: geyserflow
  invariant_type: ledger

palette:
  bg:      "#050a08"
  bg2:     "#132420"
  glow:    "#f0c690"
  accent:  "#5aa89c"
  accent2: "#e88c4a"
  ink:     "#f0efe6"

visual_style:
  composition: side-section
  subject: "a hand's width of superheated ground in section — a narrow central throat, a shallow pool, an intermittent ballistic plume when the trigger crosses"
  form_language: [SDF, value-noise-FBM, ribbon-flow, hand-painted]
  motion_character: cyclic
  registers:
    - "the deep basalt / mantle dark under the ground — via bg"
    - "the pool's cool column and steaming warmed rock — via bg2"
    - "sulfur light on the plume (the load-bearing highlight) — via glow"
    - "the cool water-in-motion / teal pool register — via accent"
    - "the hot mantle / eruption register — the crossfade axis — via accent2"
    - "readable text over the darkest tile — via ink"
  reference_notes:
    - "an Old Faithful cutaway diagram: pool, throat, mantle-warmed dark, plume above"
    - "the sky and pool crossfade between a 'cool' register and a 'hot' register as the phase moves through build → erupt → cool"
    - "the plume as a stack of upward-advecting gaussian rings warped by fbm — a wider ring at Q_erupt so discharge reads off the visible cross-section"
    - "the guide screenshot at public/guide/geyser.jpg reads dark — probably captured before the shader landed; the shader body is the source of truth for this room"
  banned_forms:
    - "no createRadialGradient, no shadowBlur per AGENTS.md"
    - "no per-frame allocation — heat-marks, ripples and rings go through the shared instanced pass"
    - "no top-down or first-person view — section only, seen from the front"
    - "no painted plume — its height and cross-section are read live from uPlumeHeight / uPlumeQ"
  mood: "a waiting-for-an-event room — a slow build hisses, the plume rides the release, the pool cools and starts again"
  gesture_feedback_style: "a tap rings the throat at the local head (pitch = ringHzFor(H)); a dwell plants a heat-marker whose corona brightens with local T; a knock near the trigger can actually push the cycle over — the room's touch-reachable secret"

verbs_answered:
  - tap
  - dwell
  - ceremony
  - drag
  - flick
  - twist
  - twist3
  - tap3
  - drag3
  - hold3
  - scrub
  - drum
  - arrows
  - tilt
  - shake
  - knock
  - flip

guide:
  title: "the geyser — build, erupt, cool"
  scale: >
    the drop band — cabinet peer behind the spring, ahead of the coin: a
    hand's width of superheated ground in section, where a narrow throat
    fills against a hysteretic trigger and fires a ballistic column when
    head and temperature time each other into the red.
  essence: >
    a two-state thermal ledger — an aquifer head H(t) under a narrow throat
    and a temperature T(t) in the same column — with an eruption trigger
    E = H·T that fires when it crosses upward and reseats only after E has
    fallen well below it. the room is not a fountain — it is the wait for
    one; a slow build hisses under the ground, the plume rides the release,
    the pool cools and starts again. the whole rhythm is read off the two
    numbers and the phase the column is in; nothing on the shelf is created
    except what the sky gave back or the mantle quietly poured in.
  moves:
    - "tap → rings the throat at the local head; the pitch rises through the build and drops after the fire, so the same room sounds like two different rooms across a cycle"
    - "dwell → warms the local ground with the palm's own heat, accelerating the build; keep pressing and T climbs faster toward the trigger"
    - "ceremony (hold to the tier) → releases the throat manually — a fired eruption whether the trigger was ready or not, kept as a mark of intent"
    - "drag → the surface film slides while the pool cools; a shear across the plume, no change to the ledger"
    - "flick → throws a bubble at that point; a small plume-of-a-plume, its pitch the head that shaped it"
    - "twist → raises the cycle lens: H(t), T(t), the trigger line, time-until-next-eruption, plume height"
    - "twist3 → walks the year through the thermal register; winter mutes the mantle, summer stokes it, the interval between eruptions changes with the season"
    - "tap3 → tutti; every phase rings at once — the room's own beat across the whole cycle"
    - "drag3 → the world-law: down is rain (recharge; H rises faster), across is warmth (mantle; T rises faster)"
    - "hold3 → time dilation while held; the ledger's clock runs slow so a wait can be inspected"
    - "scrub → stirs the pool from above; the pool cools faster as its surface exchanges heat with the air"
    - "drum (two hands alternating) → the wave field between them times the build, and a landing hit near the trigger can push it over"
    - "arrows → walk the surface cursor; enter held warms the ground at the cursor; escape lowers the lens"
    - "tilt / shake / knock / flip (once invited) → the pool leans, the surface scatters, a struck ground rings the column, face-down is night — the ground glows red where the mantle is loudest"
  finds:
    - "the pitch is the head times the temperature — an eruption is the geometry meaning the room made"
    - "a geyser left to itself falls into a rhythm; the interval is the mantle warmth minus the wind's chill, and the cycle keeps in the ledger's own closed form"
    - "a manual ceremony is not free — it dumps head and heat that would have fed a bigger natural fire five minutes later"
    - "the plume height IS Q_erupt, and Q_erupt IS the head and temperature that got dumped — three lenses on the same instant"
    - "a fortnight's absence is read off a closed-form cycle counter, not replayed — the room does not owe the visitor the fires they missed"
  keeps: >
    the current head, the temperature, the phase the column is in, the count
    of eruptions ever fired, the season the year had reached, and the hour
    it was last looked at.

# ——— the "alive at rest" / "make and unmake" / "haptics" contract ————————
# Round-trip-derived from src/components/Geyser.tsx and src/lib/geyserflow.ts.
# The room's declared noun is `eruption`, but the actual countable object
# the hand plants is a HeatMark (a warmed patch of ground that pushes the
# state's T upward). Vents are conceptual (one, at the throat). MAX_HEAT_MARKS
# = 16. The eruption itself is a phase-change event, not a countable object.
# Persistence via the room's own storage_key.
life:
  population:
    objects:
      - noun: heat-mark
        max_count: 16   # MAX_HEAT_MARKS from src/lib/geyserflow.ts
        state_shape: "id, x, y, strength (contribution to T), t0, decay time constant"
        lifecycle: "born under dwell (plantHeatMark at cursor, strength grows on saturating curve of e.elapsed) → contributes to T while alive → sealed by ceremony (manualErupt — the room's touch-reachable ignition, whether or not E was ready) → retires by exponential decay after eruption dumps T"
        persistence: LetGo
        creates_via_verb: dwell
        retires_via: [ceremony, LetGo]
        implementation_hint: SceneObjectSpec
  breath:
    period_seconds: 7
    reads:
      - "uBreath uniform (fragment shader — air column airCol *= 0.86 + 0.14 * uBreath)"
      - "uBreath uniform (Snell surface highlight 0.85 + 0.15 * uBreath)"
      - "uBreath uniform (hot-register mineral bloom `0.6 + uBreath * 0.4`)"
    behavior_at_rest: "air column brightens/dims by ±14%, surface highlight rides ±15%, the hot mineral rim swells by ±40% — the throat pulses gently between eruptions, a slow gaussian ring migrating up from the mouth whose brightness is monotone in T"
  glimmer:
    after_idle_ms: 20000
    visual: "one heat mark's corona lightens for half a breath (visual only), or the throat emits a wider ring as the phase quietly builds"
  haptics_grammar:
    tap: tap                # ring the throat at the local head → haptics.tap()
    dwell: tap              # plantHeatMark → tap; deepen ticks are silent
    ceremony: bloom         # manualErupt → haptics.bloom() (the touch-reachable ignition)
    drag: null              # surface film slides — ledger unchanged, no haptic
    flick: chop             # bubble thrown → haptics.chop()
    twist: lens             # cycle lens raise → haptics.lens()
    twist3: detent          # walking the year through advanceExact
    tap3: roll              # tutti across all three phase registers → haptics.roll()
    drag3: null             # world-law writes (rain / warmth) — continuous, no haptic
    hold3: null             # time dilation
    scrub: null             # stirCool writes into T — audible, not felt
    drum: tap               # a beat between two zones
    knock: bloom            # the touch-reachable secret: a strong knock CAN fire the geyser (E > E_HIGH − intensity·κ) → bloom on ignition, detent otherwise
    shake: null             # scatter — no per-event haptic
    tilt: null              # continuous lean
    flip: null              # night toggle
    arrows: tap             # moveCursor / keyTap
  make_unmake:
    letgo_clears_population: true   # `clear` → state = initState(SEED); heat marks empty, phase returns to "building", eruptions count resets
    ceremony_is: "firing the throat manually (manualErupt) — a ballistic eruption whether or not the trigger E was ready, and increments the persistent eruptions count"

# ——— the three LLM slots ————————————————————————————————————————————————

shader_intent: >
  paint one hand-width of superheated ground in section, seen from the front.
  the upper third is air; below it the ground meets a shallow pool at a
  wavy waterline, and rising through the pool's center is a narrow throat
  down into the mantle-warmed dark. the whole scene has two contrastable
  palette registers, and the load-bearing shader map is PHASE → REGISTER:
  the "cool" register (bg → bg2 depth column, accent teal in the water,
  the surface a low-angle Snell reflection of a cool sky) rules during
  build and cool; the "hot" register (bg → accent2 orange under-glow, the
  ground itself glowing red in the throat's neighborhood, the surface torn
  by rising steam) fades in as eruption approaches and holds through the
  fire before crossfading back. a `uPhase` uniform in [0, 3] carries which
  phase (0 = building, 1 = triggered, 2 = erupting, 3 = cooling) and a
  `uHot` uniform in [0, 1] carries the interpolation weight. the plume is
  a fluid-like vertical column drawn by a `uPlumeHeight` uniform ∈ [0, 1]
  and `uPlumeQ` (the eruption discharge Q_erupt in m/s equivalent);
  paint it as a stack of gaussian rings advecting upward from the throat's
  mouth, warp them with fbm modulated by height, and let the widest ring
  sit at Q_erupt so the eye can read discharge off the visible cross
  section. the INVERTIBLE map at eruption is PLUME_TOP_Y → Q_erupt — a
  taller column IS a bigger discharge and can be measured. between fires,
  the throat pulses gently: a slow gaussian ring migrating up from the
  mouth with brightness monotone in T (invert the mouth's brightness and
  you recover the ground's temperature). every dwell heat-marker and
  ripple wavefront is drawn as an SDF disc with an additive corona
  through the shared instanced pass; no `createRadialGradient`, no
  per-frame allocation. mineral bloom at the wet edge uses a value-noise
  fbm modulated by phase — mineral rims blooming at every cool, so the
  room ages visibly with each cycle. palette registers: `bg` is the deep
  water dark and the mantle-dark under the ground, `bg2` is the pool's
  column and the warmed rock, `glow` is sulfur light on the plume (the
  load-bearing highlight), `accent` is the cool water in motion register,
  `accent2` is the hot heat register — the crossfade axis, `ink` is
  readable text over the darkest tile. the twist lens is a second render
  path: H(t) and T(t) drawn as bars, the trigger line as their product,
  the eruption count, an interval clock, and the phase name.

domain_intent: >
  write `src/lib/geyserflow.ts` around one exported `GeyserState = { H, T,
  phase, tSincePhase, eruptions, plumeHeight, plumeQ, tau, seedKey }`. H is
  aquifer head (m, 0..1), T is temperature (0 = frost, 1 = boiling), phase
  is a discrete tag in {"building", "erupting", "cooling"} (kept as a
  string for legibility; the invariant is the two numbers plus a
  hysteretic threshold). climate `Climate = { warmth, wet }` drives two
  linear responses: recharge W(warmth, wet) as in springflow (bounded at
  W_MAX) and a mantle heating rate M(warmth) that also scales with warmth.
  the eruption energy is `E = H * T`. the hysteretic trigger fires an
  eruption when the state is in "building" and `E >= E_TRIGGER_HIGH`;
  the state stays in "erupting" for a fixed ERUPT_DURATION_S during which
  H and T are dumped along a closed-form decay (H(t) = H₀·e^{-t/τ_H} and
  T(t) = T₀·e^{-t/τ_T} with τ_H, τ_T short); the state moves to "cooling"
  when the eruption timer expires, and re-enters "building" only when E
  has fallen below `E_TRIGGER_LOW` (E_TRIGGER_LOW < E_TRIGGER_HIGH — the
  hysteresis, so a marginal state does not fire ten times a second).
  export `advanceExact(state, seconds, climate)` — closed-form per phase
  branch, MAX_ELAPSED_S = 14 days cap. between eruptions the ledger is
  the coupled system dH/dt = W and dT/dt = M − c·(T − T_air); both are
  linear-in-time with an exponential relaxation on T that has a closed-
  form solution. during "erupting" the state advances along the decay
  curves and the plumeQ / plumeHeight are read as the current discharge
  and its integral. during "cooling" the ledger sits at the low corner:
  H is small, T decays back to ambient, and E must drop under
  E_TRIGGER_LOW before the phase can flip. export the invertible map
  `ringHzFor(H) = PITCH_BASE_HZ * 2^(H/PITCH_SCALE_M)` and its exact
  inverse `headForRingHz(hz)` — spring's map, kept, because pitch = head
  is a load-bearing legibility claim across the drop band. also export
  `Q_erupt(state) = ERUPT_C * H0 * T0 * e^{-tSincePhase/τ_Q}` (returns
  0 outside "erupting"), `phaseName(state)` returning the phase string,
  `timeUntilEruption(state, climate)` returning ∞ if not "building" and
  otherwise the closed-form time-to-cross computed against the current W
  and M rates (a real number in seconds; monotone-decreasing along the
  build), and `totalWater(state) = H + POOL_L` where POOL_L is the
  ambient pool level constant — the observable the test uses to check
  that Q_erupt subtracts exactly what it says it subtracts from H. cap
  elapsed at MAX_ELAPSED_S = 14 days, use hashSeed / mulberry32 / clamp
  from the prelude, no DOM, no audio, no `Math.random`, no `Date.now`.

verb_intent: >
  every handler reads `GeyserState` from a stable `apiRef` and forwards to
  a method on `GeyserApi`. `tap` rings the throat at the finger; pitch
  from `ringHzFor(state.H)`, and a smaller `e.intensity` rings a smaller
  ripple, so the pitch alone tells the current head. finding a live plume
  vs. a calm pool is an audible answer, not a visual one. `dwell` plants
  a heat-marker at the finger and warms the local T while held; the T
  contribution grows as an increasing but saturating function of
  `e.elapsed` (θ(t) = θ_max · (1 − e^{-t/τ})) so a two-second dwell
  contributes more than a one-second dwell but a ten-second only 1.5×
  more than a five-second — never fires identically at 900ms and 2400ms.
  `ceremony` calls `manualErupt(state)` — a manual trigger that fires the
  column whether E was ready or not, and marks the state with `+1 to
  eruptions`; audio bells and the shell's `bloom` haptic land in the same
  frame; a `world.ts` bus write keeps the count. `settle` (a hold that
  lifted early) leaves the local heat where it was but stops adding.
  `drag` slides the surface film — a linear pool-tilt proportional to
  `e.dx, e.dy`, ledger unchanged (shear, not leak). `flick` throws a
  bubble at the point — one small ring wavefront with its own pitch, no
  eruption. `stir` rotates the pool and *cools* it — the scrub verb
  writes a small negative into T's rate (heat exchanging with the air
  above), which pushes eruption further out; the test pins the
  monotonicity. `twist` raises the cycle lens; a `tap` with
  `e.fingers === 2` (step back) lowers it. `season` (twist3) walks the
  year through Climate's warmth axis, and `advanceExact` catches the
  cycle up on the closed form — a whole summer can pass through and
  every fire that would have happened has been counted. `tap3` (tutti)
  is one chord across all three phase registers — the room's own beat.
  `drum` beats the wave field between two zones; a hit landing near the
  trigger is *not* free (does not automatically fire), but its arrival
  is registered on the cycle-lens as a small negative to the interval
  clock. `drag3` writes into Climate — `e.dy` is rain (W up, T
  unchanged; a downpour will refill the aquifer without cooling the
  mantle), `e.dx` is warmth (M up; hotter climate → shorter interval).
  `hold3` slows the room's clock (a real dt scale, not an animation
  trick). the vessel: `tilt` leans the surface highlight, `shake`
  scatters the plume (an event that decays back), `knock` rings the
  column as a struck stone — pitch is `ringHzFor(H)` again, and can
  actually push a near-triggered state over: if the state is in
  "building" and `E > E_TRIGGER_HIGH - knock_intensity * κ` the knock
  fires the eruption. this is the room's touch-reachable secret. `flip`
  is night; the ground glows red where the mantle is loudest (the hot
  register brightens under night) and the surface highlight goes to a
  moon register. `arrows` walk a cursor; enter held is a keyboard dwell;
  escape lowers the lens. every verb calls into `geyserflow` shapes — no
  timing constants live in the component; every threshold is from
  `gesture/core.ts`. `settle`, `night`, `glimmer`, `moveCursor`,
  `keyTap`, `keyHold`, `keyEscape`, and `clear` follow the spring pattern
  verbatim, with `clear` returning the state to a fresh `initState(seed)`
  and setting cleared = true.

chrome:
  travel: true
  peers: true
