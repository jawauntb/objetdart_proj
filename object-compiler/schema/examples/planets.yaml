# planets — worlds condense from kept dust
#
# Round-trip-derived from src/rooms/planets/room.config.ts and
# src/lib/worldforge.ts. The `latent` invariant type: a 12-dim latent point
# IS a world, decoded into terrain, ocean, air, ring, moons and spin, and
# read back off the world exactly.

key: planets
component_name: PlanetForge

placement:
  kind: band
  band: planets

sigil: stars
desc: "worlds condense from kept dust"
cluster: nature
dark: true
home_priority: 10
ambient_profile: cosmic
storage_key: "objetdart:planets:v2"

invariant: >
  a compact 12-dimensional latent per world — radius, ocean fraction,
  terrain family, relief, atmosphere tint and depth, axial tilt, day length,
  cloud cover, ring density, moon retinue, polar ice — decoded into a world
  and read back off the world exactly. one fixed budget of dust binds them
  all.

material: 2d-over-shader
noun: world

domain_lib:
  name: worldforge
  invariant_type: latent

palette:
  bg: "#090b0e"
  bg2: "#1e3440"
  glow: "#c8732a"
  accent: "#ddd3be"
  accent2: "#4e7d8c"
  ink: "#f2eee6"

visual_style:
  subject: "one star, a fixed budget of dust, and up to nine worlds — each a lit sphere decoded from its 12-dim latent"
  form_language: [SDF, value-noise-FBM, hand-painted]
  motion_character: cyclic
  reference_notes:
    - "the way an early Cassini plate paints Saturn — a ringed disc against velvet space"
    - "planet portraits from a school atlas: visibly ochre-and-blue continents over a lit sphere"
    - "the dust-ring shimmer of an orrery photograph — a brightness that IS the mass reserve"
  mood: "attentive making; the field visibly dims as you forge, brightens as you let go"
  gesture_feedback_style: "a hold on open dust condenses a world under the finger (radius saturates on ACCRETION_TAU_MS); the accretion halo is drawn on the 2D overlay while the sphere below decodes the latent live"

verbs_answered:
  - tap
  - dwell
  - ceremony
  - drag
  - flick
  - twist
  - twist3
  - tap3
  - drag3
  - hold3
  - scrub
  - arrows
  - tilt
  - shake
  - knock
  - flip

guide:
  title: "worlds condense from kept dust"
  scale: "the planets band — between the ground and the system"
  essence: >
    a star, one fixed budget of dust, and the worlds a hand condenses out of
    it. each world is a compact latent vector decoded into terrain, ocean,
    air, ring, moons and spin — and read back off the world exactly. the
    orbit you leave a world in writes its surface: near the star its seas
    boil, far out the ice takes it.
  moves:
    - "hold on open dust → a world condenses under the finger and keeps growing for as long as you hold; it joins the disc on the orbit of the place it was made"
    - "hold on a world → keeps accreting onto that one, drawing the field's reserve down as it grows"
    - "tap a world → it comes forward and states its chord; tap the dark → the dust stirs where the finger landed"
    - "rapid taps (1 / 3 / 5 / n) → stir / chord → bright flash → a world condenses → the forge answers tutti"
    - "drag a world → it goes where the hand goes and keeps the throw when you let go"
    - "flick a world → a real throw; fling one into the star and it is eaten, and its mass comes back as dust"
    - "let two worlds meet → they merge, mass conserved, the child wearing both parents' vectors; what will not fit is ejected"
    - "circle a finger around a world → winds its ring denser, the other way lets it out — a felt click where the ring condenses"
    - "twist → the focused world turns under the hand, and enough turn raises the lens: twelve spokes, the latent read back live"
    - "three fingers drag → sideways turns the star up and down and every climate answers; up and down leans the axis"
    - "three-finger twist → runs the whole system's clock; three-finger hold → time slows while held; three-finger tap → tutti"
    - "tilt (once invited) → the field leans into real gravity; shake → every orbit is perturbed; knock → the focused world answers with its chord; face-down → night"
    - "arrow keys → walk the field and raise or flood the focused world; [ and ] → dim and brighten the star; backspace → let one world go"
  finds:
    - "the shimmer of the disc is the mass reserve itself — forge greedily and the field visibly dims until something is let go"
    - "nothing fires the same at 900ms and 2400ms: accretion is one continuous curve of the held time"
    - "park a world close in and its oceans boil away and its air escapes; throw it out and ice takes the whole surface"
    - "a world close to the star is tidally braked — its day lengthens toward its year, and the fast ones visibly flatten at the poles"
    - "each world's chord is read off its vector: ringed worlds carry a fifth the bare ones lack"
  keeps: "the worlds you forged, where in their orbits they are, and a deliberate clearing"

# ——— the "alive at rest" / "make and unmake" / "haptics" contract ————————
# Round-trip-derived from src/components/PlanetForge.tsx and src/lib/worldforge.ts.
# The population is one bounded fleet of worlds, MAX_WORLDS=9, born by a
# `dwell` on the dust reserve (mass grows via `accretionRadius(holdMs)`,
# reserve visibly dims as it does), retired by being flicked into the star
# (which returns their mass to the reserve — a real thermodynamic loop) or
# by two colliding into a merge (mass conserved, latent interpolated by
# mass), or by shifting past MAX_WORLDS (oldest retired, mass returned).
# Persistence: the room's own storage_key, gated by LetGo.
life:
  population:
    depth_note: >
      two addressable populations: the worlds themselves (up to nine,
      each a compact 12-dim latent decoded into a body) and the dust
      motes of the reserve (a bounded set of DUST_N=260, redrawn every
      frame from the mass reserve as a point-cloud pass). moons are a
      latent DIMENSION of a world rather than a separate population,
      so they count with the world that owns them; the star itself is
      a fixed singleton with its own luminosity ledger, and does not
      count as a population in the "dwell creates one" sense. calling
      this "one population plus a field" would be honest for /spring's
      shape but wrong here — dust moves independently and its
      brightness IS the reserve, an invertible visual invariant.
    objects:
      - noun: world
        max_count: 9   # MAX_WORLDS
        state_shape: "12-dim latent (radius, ocean, terrain family, relief, atmosphere tint, atmosphere depth, axial tilt, day length, cloud cover, ring density, moon retinue, polar ice) + orbit + mass + seed"
        lifecycle: "born under dwell (accretionRadius saturates on ACCRETION_TAU_MS) → grows further while held → sealed at ceremony holds → retires by flick-into-star (mass returned to dust reserve), by merge with another world (mass conserved, latent interpolated), or by exceeding MAX_WORLDS (oldest wins the shift, mass returned)"
        persistence: localStorage
        creates_via_verb: dwell
        retires_via: [flick, ceremony, LetGo]
        implementation_hint: "inline array + persisted through the room's own storage_key"
      - noun: dust mote
        max_count: 260   # DUST_N
        state_shape: "phase (0..τ), radius (0.06..0.68), tumble (0..τ), seed"
        lifecycle: "born once at genesis by mulberry32(hashSeed(0xd05, 0x7)) → orbits the star on its own phase → each mote's alpha reads from the mass reserve, so the whole disc visibly dims as worlds condense out of it and brightens when a world is flicked back into the star"
        persistence: ephemeral
        creates_via_verb: tap
        retires_via: [LetGo]
        implementation_hint: "inline Float32Array (dustArr, 4 values per mote) + one instanced draw call (dustDraw); alpha per mote sampled live from the reserve — not persisted, redrawn from the reserve each frame"
  breath:
    period_seconds: 7
    reads:
      - "u_breath uniform (star shader — halo airy pattern)"
      - "u_breath uniform (body shader — atmosphere breath multiplier `0.92 + 0.13 * u_breath`)"
      - "clocks.breath (the shell's clock pack read every frame)"
    behavior_at_rest: "the star's halo airy pattern widens and dims by ±14% on the 7s clock; every body's atmosphere brightens and dims by ~13% — the whole system breathes in one register"
  glimmer:
    after_idle_ms: 20000
    visual: "a small tick fires from the focused world (haptics.detent + audio ping), and its corona brightens for half a breath"
  haptics_grammar:
    tap: tap                # tap on a world → tap; tap on dust → tap
    dwell: bloom            # accretion under dwell → haptics.bloom() as the world condenses
    ceremony: bloom         # ceremony seal → bloom
    drag: ripple            # drag a world → ripple
    flick: chop             # throw a world → chop
    twist: lens             # focused-world twist raises the lens
    twist3: detent          # system clock detent
    tap3: ripple            # tutti chord
    drag3: ripple           # world-law wind (star luminosity / axis)
    hold3: null             # time dilation
    scrub: detent           # ring-winding fires a felt click per condense
    drum: ripple            # ripple between two zones
    knock: chop             # jostles the system → the focused world answers
    shake: chop             # perturbs every orbit
    tilt: null              # gravity vector — visual
    flip: null              # night
    arrows: tap             # walk the field
  make_unmake:
    letgo_clears_population: true   # `letGo` returns every world to dust (reserve visibly restored)
    ceremony_is: "the ceremony hold approaches RADIUS_MAX — the world is sealed at its maximum accretion and the dust is drawn down to its floor"

# ——— the three LLM slots ————————————————————————————————————————————————

shader_intent: >
  paint one fixed disc: a star at centre, a thin dust ring, and up to nine
  worlds on their own orbits. draw four passes: (1) the background — dark
  space with faint noise; (2) the dust disc, a soft ring whose radial
  brightness IS the current mass reserve (`DUST_TOTAL` minus what the
  worlds hold), so forging greedily visibly dims the field; (3) the star,
  an SDF disc with a corona whose warmth reads the star's current
  luminosity; (4) each world as one instanced SDF disc with its shader
  decoding the world's 12-dim latent into surface colour, cloud pattern
  and ring bokeh — an ocean coordinate that raises land moves the world's
  colour from blue toward ochre in the same frame. climate is not a decal:
  the star heats close-in worlds until the shader burns off their ocean
  and thins their atmosphere, and cools far-out ones until the shader ices
  them over. the 2D overlay draws the accretion halo under the finger and,
  when the twist lens is up, the twelve spokes of the focused world's
  latent, one per dimension. palette registers: `bg` is deep space, `bg2`
  is the dust plane, `glow` the star's warmth and the inner worlds'
  ochre, `accent` the ink of the world card, `accent2` the outer cool
  blue, `ink` the lens spokes. the visible invariant is invertible: the
  shader draws only what `worldFromLatent` decoded.

domain_intent: >
  write `src/lib/worldforge.ts` as the planet latent (INSPIRATION.md §6).
  `LATENT_DIM = 12`, `MAX_WORLDS = 9`, `DUST_TOTAL = 1` (one fixed budget
  of dust, mass conserved). export `worldFromLatent(latent[12]) -> World`
  as an affine decode — radius from `RADIUS_MIN..RADIUS_MAX`, ocean
  fraction, terrain family, relief, atmosphere tint and depth, axial tilt
  bounded by `TILT_MAX`, day length in `DAY_MIN..DAY_MAX`, cloud cover,
  ring density (visible above `RING_MIN`), moon retinue up to `MOON_MAX`,
  polar ice. export `latentFromWorld(world) -> latent[12]` as the exact
  inverse — the round trip is the room's whole thesis; if it drifts the
  room is decoration. sculpting is movement of the point: `raiseLand(lat,
  dLand)` lifts the terrain coordinate and drops the ocean one in the
  same call; `windRing(lat, dRing)` moves the ring density. export
  `accretionRadius(holdMs)` — a saturating exponential curve with
  `ACCRETION_TAU_MS = 1400` — so nothing fires the same at 900ms and
  2400ms, and a ceremony hold approaches the maximum without leaping to
  it. export `merge(a, b)` — mass conserving, the child wearing an
  interpolated latent weighted by mass; what will not fit is ejected as
  dust. export `climateFor(world, distanceToStar, luminosity)` so the
  same latent parked close in boils its ocean and far out ices over.
  export `chordFor(latent) -> Voice[]` and its inverse `latentTraits(chord)`
  — ringed worlds carry a fifth the bare ones lack, so the chord reads
  the vector back. constants: `MASS_MIN = 0.02`, `MASS_SPAN = 0.26`. no
  DOM, no audio, no `Math.random`, no `Date.now`; the seed is passed in.

verb_intent: >
  every handler reads and writes the field's `{ worlds[], reserve,
  starLuminosity }` ref. `dwell` on open dust condenses a world under the
  finger — held time is the accretion clock, `accretionRadius(holdMs)`
  grows the radius, and the dust reserve is drawn down by the mass added;
  ceremony holds approach `RADIUS_MAX`. `dwell` on an existing world
  keeps accreting onto that one. `tap` on a world plays its `chordFor`
  and brings it forward as `focused`; `tap` on the dark stirs the dust
  where the finger landed. `drag` on a world moves it in space, keeping
  the throw when released. `flick` throws — hard enough into the star,
  the star eats the world and returns its mass to `reserve`. two worlds
  that meet call `merge`; what will not fit is ejected. `scrub` (finger
  circling around a world) winds the ring — clockwise densifies, other
  way rarefies; each condense fires a felt click. `twist` on a focused
  world turns it under the hand; enough turn raises the lens (twelve
  spokes, the latent read back live). `tap` fingers === 2 lowers the
  lens (stepBack). `drag3` writes the world-law: horizontal turns the
  star's luminosity up or down (every climate answers via
  `climateFor`), vertical leans the axis. `twist3` runs the whole
  system's clock. `hold3` slows the sim clock while held. `tap3` (tutti)
  fires every world's chord at once. the vessel: `tilt` writes a
  gravity vector that the perturbation layer uses to lean orbits;
  `shake` perturbs every orbit; `knock` sounds the focused world's
  chord; `flip` is night. `arrows` walk the field; enter raises or
  floods the focused world (writes into `ocean fraction` and `relief`);
  `[` and `]` dim and brighten the star; backspace lets one world go
  (mass returns to reserve). no room-local timing constants — the
  handlers read `ACCRETION_TAU_MS` from `worldforge.ts` and all tier
  gates from `gesture/core.ts`.

# ——— phase 7: DEPTH — the four axes ———————————————————————————————————
# Round-trip-derived from src/components/PlanetForge.tsx: four shader
# programs (body, ring, dust, star), two populations, five discoverables
# tied to real physics, and a state lattice of day/night × dilated ×
# lens/12-spoke × merge/scatter/settle.

shader_layers:
  - name: aventurine background field
    brief: >
      The base of the room: a shader-driven `bg` colour with faint
      value-noise stars in the far dark; no allocation per frame, one
      quad drawn behind the star and body passes. Reads `u_night` to
      dim toward the flip-face-down state.
    register: "bg+bg2"
    order: background
  - name: dust disc
    brief: >
      One instanced point-sprite draw for DUST_N=260 motes, each with
      its own phase, radius, tumble and seed. Alpha per mote is a live
      sample of the mass reserve (DUST_TOTAL − Σ world mass) — forge
      greedily and the whole disc visibly dims; flick a world back into
      the star and the disc brightens. The load-bearing invertible
      visual invariant.
    register: "accent+glow"
    order: midground
  - name: star + corona
    brief: >
      One SDF disc at the field centre, corona = exp(-r · 6) · 0.9 +
      exp(-r · 2.2) · 0.28, granulation from vnoise on u_time, breath =
      0.92 + 0.13 · u_breath — the star swells on the shared 7s clock,
      not one of its own. u_lum reads the current luminosity, u_night
      pulls the star toward dark on face-down.
    register: "glow"
    order: midground
  - name: worlds — instanced body pass
    brief: >
      Up to MAX_WORLDS × (1 + 3) = 36 instanced SDF discs (worlds plus
      their moons), each decoding its own 12-dim latent live in the
      fragment shader: ocean fraction, terrain family, relief, cloud
      cover, atmosphere depth, axial tilt, spin phase, oblateness, ice
      caps, ring density all read from a_p0/a_p1/a_p2/a_p3 vertex
      attributes. Lighting: the star is the ONLY lamp, and the ring's
      shadow is cast through the equatorial plane onto each sphere.
      One instanced draw for the whole fleet.
    register: "accent+accent2+glow"
    order: foreground
  - name: ring arcs
    brief: >
      A second instanced draw for the ring around each ringed world
      (density > RING_MIN). Twelve arcs per ring, each a thin band with
      value-noise banding.
    register: "accent2"
    order: foreground
  - name: 2D overlay — accretion swirl + lens spokes
    brief: >
      The thin canvas above the shader: the accretion halo under a
      dwell (haptics.bloom fires on ceremony), the scattering of a
      retired world, the flick-into-star arc, and — when the twist
      lens is raised — the twelve spokes of the focused world's latent
      drawn as a ring, each spoke labelled with what dimension it
      encodes. The one lettered surface.
    register: "ink+paper"
    order: overlay

discoverables:
  - trigger: "flick a world hard enough that its trajectory clears escape velocity (ESCAPE_R = 1.7 field units)"
    response: "the world scatters over RETIRE_MS=1600 as a returning cloud of dust motes; the mass reserve visibly climbs; a thud fires; the disc brightens where the mass returned"
    register: multiple
  - trigger: "flick a world into the star (its trajectory crosses STAR_RADIUS)"
    response: "the star eats the world, u_lum rises, and the world's mass returns to the reserve as dust — a real thermodynamic loop, not a disappearance"
    register: multiple
  - trigger: "let two worlds' orbits cross so their bodies touch"
    response: "they merge — mass is conserved, the child's latent is a mass-weighted interpolation of the parents', and what will not fit as a single world is ejected as dust; the merge fires haptics.bloom() and a chord read from the combined latent"
    register: multiple
  - trigger: "park a world close to the star (small orbit radius) and wait through the settle clock"
    response: "temperature01 climbs on the inverse square, atmosphereRetention drops (Jeans escape), settleClimate drives the latent's ocean fraction toward evaporation and cloud cover to zero — the shader shows the seas boiling away and the world drying to a stone; the same latent parked far out ices over"
    register: sight
  - trigger: "twist a focused world past the lens threshold"
    response: "the twelve-spoke latent notation appears as a ring around the world — each spoke a labelled dimension, each length its current value; the shader's decode is drawn side by side with the latent's read-back so the whole load-bearing invertible map (worldFromLatent → latentFromWorld) can be inspected live"
    register: sight
  - trigger: "scrub (a finger circling) around a world"
    response: "windRing writes into the ring-density dimension of the latent — clockwise densifies, other way rarefies; the shader repaints the ring in the same frame; each condense fires a felt click through haptics.detent"
    register: multiple

state_machine:
  states:
    - name: day
      description: "the default; the star illuminates every world's day hemisphere; u_night = 0"
      visible_change: "worlds' day hemispheres light on their tilt-relative light angle; the dust disc glitters at its default alpha; the ambient bed is 'cosmic' with the band's own register on top"
    - name: night
      description: "vessel flip event (faceDown = true) sets u_night → 1 over one breath"
      visible_change: "the whole field darkens by ~85% (col = mix(col, C_NIGHT, u_night · 0.85)); the star dims by (1 − u_night · 0.9); embers show on the night side of every world where landness > 0.08 — the candle again, at planetary scale"
    - name: dilated
      description: "three fingers held; the sim clock scales down to as slow as 0.05× wall time"
      visible_change: "every world's rotation and orbit visibly slow; dust motes drift more slowly; the audio bed thickens on a matching detent"
    - name: lens/twelve-spoke
      description: "twist on a focused world past the lens threshold; the latent notation ring draws around it"
      visible_change: "twelve spokes label each latent dimension; the world spins under the hand as the twist deepens; the shader continues drawing what worldFromLatent decoded, so the notation and the body agree by construction"
    - name: merge-in-flight
      description: "two worlds' orbits have crossed and the merge integrator is running"
      visible_change: "the pair leans together, mass conserving; a bloom fires when the bodies contact; the child's latent takes its place; unfit mass ejects as dust"
    - name: scattering
      description: "a retired world (flicked past escape or into the star) is over RETIRE_MS=1600"
      visible_change: "the world's alpha fades to zero; a cloud of dust motes fans outward from its last position; the mass reserve climbs by the world's mass; the disc brightens"
  transitions:
    - from: day
      to: night
      trigger: "vessel flip event faceDown → true; night(e.faceDown) writes u_night's target to 1"
    - from: night
      to: day
      trigger: "vessel flip event faceDown → false; u_night eases back to 0 over one breath"
    - from: "*"
      to: dilated
      trigger: "three-finger hold enter; timeScale(k) writes the sim clock to 0.05..1"
    - from: dilated
      to: "*"
      trigger: "three-finger hold release; timeScale(1)"
    - from: "*"
      to: lens/twelve-spoke
      trigger: "twist on a focused world raises the lens past its threshold; lens(e.velocity) writes into the lens ref"
    - from: "*"
      to: merge-in-flight
      trigger: "two worlds' bodies touch; stepBodies integrator finds the collision and mergeWorlds runs"
    - from: merge-in-flight
      to: day
      trigger: "the merge integrator has settled — the child world is placed, unfit mass ejected as dust"
    - from: "*"
      to: scattering
      trigger: "a world is retired — flicked past ESCAPE_R, flicked into the star, or shifted out because MAX_WORLDS was exceeded; dyingAt is set to the current time; scatter runs over RETIRE_MS"
    - from: scattering
      to: day
      trigger: "RETIRE_MS elapses; the entry is removed from the worlds array; mass returned to the reserve"
