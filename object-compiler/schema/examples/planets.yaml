  bg2: "#1e3440"
  glow: "#c8732a"
  accent: "#ddd3be"
  accent2: "#4e7d8c"
  ink: "#f2eee6"

visual_style:
  subject: "one star, a fixed budget of dust, and up to nine worlds — each a lit sphere decoded from its 12-dim latent"
  form_language: [SDF, value-noise-FBM, hand-painted]
  motion_character: cyclic
  reference_notes:
    - "the way an early Cassini plate paints Saturn — a ringed disc against velvet space"
    - "planet portraits from a school atlas: visibly ochre-and-blue continents over a lit sphere"
    - "the dust-ring shimmer of an orrery photograph — a brightness that IS the mass reserve"
  mood: "attentive making; the field visibly dims as you forge, brightens as you let go"
  gesture_feedback_style: "a hold on open dust condenses a world under the finger (radius saturates on ACCRETION_TAU_MS); the accretion halo is drawn on the 2D overlay while the sphere below decodes the latent live"

