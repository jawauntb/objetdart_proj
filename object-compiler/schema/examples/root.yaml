# /root — one root network extending down from a plant into the soil.
#
# Peer of the drop band, cabinet ring, sitting after the current tail of the
# manifest ringAfter chain (pebble). The natural chain of the ring is
# drop → seed → rocks → soil → spring → geyser → pebble → root → coin → … .
# Where /soil is a five-pool ledger of what the ground IS and /spring is a
# two-cell hydraulic ledger, /root is the LIVING NETWORK plumbing the two
# together: a directed tree of nodes standing in the ground, drawing water
# up along parent edges and pushing sugar down along the same edges, growing
# where local sugar × water is highest.
#
# Fresh invariant type: **chain**. Prior generated rooms rode `ledger`
# (spring/geyser) and `lattice` (reef); the retrieval bank has no chain-
# typed neighbours (helices are the polymer /dna). A directed tree is chain-
# with-branching — every node has one parent, edges only run parent→child,
# and transport is local — so `chain` is the honest enum value.
#
# The sigil is "growth" (spring/geyser/reef use it too — a growth glyph
# reads correctly through the branching arc).

key: root

placement:
  kind: peer
  circle: cabinet
  band: drop
  label: "the root"
  ringAfter: pebble  # /pebble is currently ringAfter geyser, so the honest
                    # tail-of-chain anchor is /pebble; anchoring to /geyser
                    # would put the ring merge past /pebble and violate the
                    # `idx = anchor + 1` invariant test-rooms enforces.

sigil: growth
desc: "the network, hunting water in the dark"
cluster: nature
dark: true
home_priority: 9
ambient_profile: garden
storage_key: "objetdart:root:v1"

invariant: >
  a rooted directed tree of nodes anchored under a plant crown at the top of
  the section, each node carrying a scalar water w ∈ [0, 1] and a scalar
  sugar u ∈ [0, 1]. every parent-child edge transports water UP and sugar
  DOWN each closed-form step. only tips (childless nodes) grow, and only
  where local sugar × water is high — the load-bearing map is DEPTH → PITCH,
  a shallow tip rings HIGH, a deep tip rings LOW, and from the ring alone
  you recover the tip's depth.

material: 2d-over-shader
noun: tip

domain_lib:
  name: rootnet
  invariant_type: chain

palette:
  bg:      "#070504"
  bg2:     "#3a2a1a"
  glow:    "#dbc98a"
  accent:  "#5a8b8b"
  accent2: "#c8945a"
  ink:     "#efe8dc"

visual_style:
  subject: "a hand's width of soil in section — a warm gold-lit plant crown just above the surface, a directed tree of root nodes extending down through humus-brown-to-near-black ground, bold warm capsule edges connecting each node to its parent, a bright glow terminus at every tip, and mycorrhizal patches that concentrate wherever the tree itself is dense"
  form_language: [SDF, value-noise-FBM, ink-line, point-cloud]
  motion_character: drifting
  reference_notes:
    - "a botanical section illustration: an olive-gold crown mixed from the warm and cool named registers above the topsoil line, a warm humus brown deepening to near-black ground below with real top-to-bottom contrast, a hand-drawn tree of bold warm-toned roots reaching downward with a bright glow node at every tip"
    - "each tip is drawn twice in one instanced pass: a capsule edge from its parent (warmed root-brown → gold by local water × sugar flow) and a bright terminus (glow core, root-brown body ring, faint cool-moisture halo) — invert either and you recover the tip's live state"
    - "the ground itself carries three grain scales (coarse clods, fine mineral speckle, a cool moisture-band FBM) plus a mycorrhizal glow masked by the same root-density field the edges are drawn from — nothing painted independent of the physics"
    - "no per-frame gradient allocation — the tree and its edges are drawn shader-side, the field from a uniform of node positions and parent indices, the population from one instanced capsule-and-terminus pass"
  mood: "patient, exploratory, quiet — the network is hunting water in the dark, the plant above is patient, the whole thing breathes slowly"
  gesture_feedback_style: "a tap rings a tip at its depth (pitch = ringHzFor(y)); a dwell recruits a new tip whose terminus brightens as it draws water up and sugar down; the ceremony seals the tip as a mature branch point (kept between visits); a hard knock dislodges every unsealed tip below a water threshold — the room's touch-reachable secret"

verbs_answered:
  - tap
  - dwell
  - ceremony
  - drag
  - flick
  - twist
  - twist3
  - tap3
  - drag3
  - hold3
  - scrub
  - drum
  - arrows
  - tilt
  - shake
  - knock
  - flip

guide:
  title: "the root — plant, node, edge"
  scale: >
    the drop band — cabinet peer behind the pebble, ahead of the coin: a
    hand's width of soil in section, where a directed tree of root nodes
    hunts water in the dark and pushes sugar down to every tip through the
    same edges its water climbed.
  essence: >
    a rooted directed tree of nodes anchored under a plant crown, each node
    carrying a water scalar and a sugar scalar. every edge transports water
    up and sugar down, both in closed form; only tips grow, and only where
    local sugar × water is high. the tip's pitch IS its depth in the ground,
    so from the ringing you recover the network's reach; nothing on the
    shelf is created except what the sun gave from above or the aquifer
    lifted from below.
  moves:
    - "tap → a ripple through the network, and the nearest tip rings at its depth; near the surface it rings high, near the bedrock it rings low, so the depth is legible before it is explained"
    - "dwell → recruits a new tip at the finger, branching from the nearest existing node; its water and sugar climb toward saturation as the network delivers them"
    - "ceremony (hold to the tier) → seals the tip as a mature branch point — kept between visits, an anchor the next generation grows from"
    - "drag → the soil lens slides; the ground column shears past the network without moving the roots"
    - "flick → throws a growth impulse at that point — a small ring wavefront up the nearest edge, its pitch the local sugar"
    - "twist → raises the network lens: every tip's depth as a labelled tick, the total root length, the mean water and sugar, and the network's mean pitch"
    - "twist3 → turns the year through sunlight; from midsummer's peak sugar to midwinter's slow, the roots stall and wake"
    - "tap3 → tutti; every tip rings at once, one chord across the whole network"
    - "drag3 → the world-law: down is soil water (aquifer lifting), across is sunlight (crown pushing sugar)"
    - "hold3 → time dilation while held; the ledger's clock runs slow so the transports can be inspected"
    - "scrub → agitates the soil column around the network; local water redistributes"
    - "drum (two hands alternating) → a rhythmic pulse of sugar down the crown side; feeding waves that speed nearby tips"
    - "arrows → walk the root cursor; enter held recruits and matures a tip at the cursor; escape lowers the lens"
    - "tilt / shake / knock / flip (once invited) → the soil leans, the ground shakes, a struck root sheds its unsealed young tips, face-down is night"
  finds:
    - "the pitch is the depth, and the map is invertible — two tips ringing the same note sit at the same depth"
    - "a network left through summer under bright light matures its deepest tips first; the shallow ones stay small until sugar reaches them"
    - "two tips within a hand's width share the same parent's sugar stream, so recruiting a third near them slows the pair's growth"
    - "a hard knock (touch-reachable secret) dislodges every unsealed tip below a water threshold — the mature branch points stay, the young are swept back"
    - "a fortnight's absence is read off the closed-form transport equations — the network does not owe the visitor the growth they missed"
  keeps: >
    every node with its depth, water, sugar and sealed status, the tree's
    parent-child edges, the total sunlight and soil-water levels, the season
    the year had reached, and the hour it was last looked at.

life:
  population:
    objects:
      - noun: tip
        max_count: 24
        state_shape: "id, x, y (depth), parentId (null for crown, int for child), generation, water (0..1), sugar (0..1), sealed (bool), phase seed"
        lifecycle: "born under dwell (spawnTip under nearest node) → water climbs from soil and sugar climbs from parent along closed-form transports while growing → sealed at ceremony (kept between visits as a mature branch point) → retires via <LetGo> or via knock (unsealed young tips below KNOCK_THRESHOLD)"
        persistence: LetGo
        creates_via_verb: dwell
        retires_via: [knock, LetGo]
        implementation_hint: SceneObjectSpec
  breath:
    period_seconds: 7
    reads:
      - "uBreath uniform (fragment shader — soil moisture bloom `0.86 + 0.14 * uBreath`)"
      - "uBreath uniform (plant crown highlight `0.85 + 0.15 * uBreath`)"
      - "uBreath uniform (root ink line breath — the network softens/hardens by ±20%)"
    behavior_at_rest: "three visible registers ride the 7s clock: the plant crown highlight brightens/dims by ±15%, the soil moisture bloom rides ±14%, the root ink-lines soften/harden by ±20%"
  glimmer:
    after_idle_ms: 20000
    visual: "one tip breathes a wider ring, alone, and nothing is said — the glimmer handler picks a tip by `state.tau * 977 % state.nodes.length` and pushes a soft impulse"
  haptics_grammar:
    tap: ripple
    dwell: tap
    ceremony: bloom
    flick: chop
    twist: lens
    twist3: detent
    tap3: roll
    scrub: tap
    drum: tap
    knock: detent
    arrows: tap
  make_unmake:
    letgo_clears_population: true
    ceremony_is: "sealing the tip as a mature branch point — the anchor persists between visits and every next dwell branches from an existing sealed or unsealed node"

shader_intent: >
  paint one hand-width of soil in section, seen from the front. the upper
  strip is the plant crown — an olive-gold mass mixed from glow (warm) and
  accent (cool) above the surface, breathing on the 7s clock. the surface
  at y ≈ 0.14 is a horizontal line; below it the soil column deepens from
  bg2 (warm humus, distinct from bg) at the top to bg (near-black) near
  bedrock, textured with three fbm grain scales (coarse clods, fine
  mineral speckle) plus a cool accent-tinted moisture-band fbm that rides
  uClimate.z (soilWater). every root edge is painted shader-side from a
  uNodes[24] uniform (xy, growth, water*sugar) and a companion uNodesB[24]
  uniform (parent xy, sealed, phase), rendered as bold accent2 ink-lines
  (signed-distance to a straight segment, a sharp 1.35x falloff so the
  boundary reads on a Sobel pass) with a glow highlight riding water*sugar.
  the same per-node loop accumulates a density field (gaussian sum of
  distance-to-every-edge) that drives a mycorrhizal accent2 fbm patch —
  concentrated exactly where the tree is thick, never painted independent
  of the physics. the population layer (one instanced pass, custom frag)
  draws two shapes per tip: a capsule edge from parent to child (half-width
  normalized by its own half-length so felt thickness stays constant
  regardless of edge length, tapered by generation) and a bright terminus
  (glow core, accent2 body, faint accent halo) whose brightness IS water ×
  sugar — invertible either way. no createRadialGradient, no per-frame
  allocation. ripple wavefronts from taps and flicks propagate through the
  soil as gaussian rings tinted accent. palette registers: bg = deep
  subsoil dark, bg2 = warm humus brown, glow = plant crown / root-tip
  light, accent = cool moisture register, accent2 = warm root /
  mycorrhizal register, ink = readable text over the darkest tile. the
  twist lens is a second render path: mean water, mean sugar, total root
  length, tips count, sealed count, and mean pitch.

domain_intent: >
  write `src/lib/rootnet.ts` around one exported
  `RootState = { nodes, soilWater, sunlight, tau, seedKey }`. `nodes` is a
  `RootNode[]` where each node has {id, x, y, parentId, generation, water,
  sugar, growth, phase, sealed}. `parentId` is null for the crown, int
  for every other node. `soilWater` and `sunlight` are scalars in [0, 1]
  the drag3 verb writes. transport laws: water flows UP along parent-
  child edges by dw = C_WATER * (w_child - w_parent) * dt; sugar flows
  DOWN by du = C_SUGAR * (u_parent - u_child) * dt. Soil water enters
  every tip at rate SOIL_C * soilWaterAt(y) * (1 - w_tip); soilWaterAt(y)
  is monotone-increasing in y (deeper tips see more of the aquifer).
  Sunlight enters the crown at rate SUN_C * sunlight * (1 - u_crown).
  Growth: only tips grow, closed-form logistic
  `g(t+dt) = 1 - (1 - g) * exp(-r_eff * dt)` with `r_eff = R_BASE * w * u`.
  advanceExact walks elapsed time forward in 60 sub-steps, capped at
  MAX_ELAPSED_S = 14 days. Load-bearing invertible map: DEPTH → PITCH:
  ringHzFor(y) = PITCH_BASE_HZ * 2^(-(y-CROWN_Y)/PITCH_SCALE_Y), exactly
  invertible by depthForRingHz. Exports: spawnTip, deepenTip, sealTip,
  knockSweep (returns {state, dislodged}), nearestNode, meanWater,
  meanSugar, sealedCount, treeDepth, totalRootLength, tips, initState.
  Constants: MAX_NODES=24, MAX_GROWTH=1, MAX_GENERATION=6, CROWN_Y=0.14,
  KNOCK_THRESHOLD=0.5, KNOCK_KAPPA=0.7. No DOM, no audio, no Math.random,
  no Date.now.

verb_intent: >
  every handler reads RootState from a stable apiRef and forwards to a
  method on RootApi. tap rings the tip at the finger, pitch from
  ringHzFor(node.y) — a smaller intensity rings a smaller ripple; the
  pitch alone tells the depth. dwell spawns a tip at the finger (refuses
  outside bounds), branching from the nearest existing node; while held,
  growth advances on the logistic `growth = GROWTH_STEP_MAX * (1 -
  exp(-elapsed / ROOT_GROW_TAU_MS))`. ceremony calls sealTip and marks
  hasKept=true. drag writes stir for the shader (soil column shear).
  flick throws a ring wavefront; the pitch is the mean tip depth.
  scrub agitates the soil column and briefly raises state.soilWater.
  drum pulses sugar from the crown (raises state.sunlight). twist
  raises the lens; two-finger tap steps back. drag3 (wind) writes to
  climate/state.soilWater/state.sunlight bounded. twist3 (season)
  advances the ledger through a chunk of the year. hold3 slows the
  clock. tap3 rings every tip at once. knock calls knockSweep — a
  hard knock dislodges every unsealed young tip whose water is below
  KNOCK_THRESHOLD * (1 - intensity * KNOCK_KAPPA); sealed and crown
  survive. flip is night. arrows walk a cursor; enter held is a
  keyboard dwell; escape lowers the lens. no room-local timing
  constants; every threshold from gesture/core.ts.

chrome:
  travel: true
  peers: true
