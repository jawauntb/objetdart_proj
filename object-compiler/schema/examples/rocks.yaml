# /rocks — the mineral seat of the drop band.
#
# Round-trip-derived from src/rooms/rocks/room.config.ts, src/lib/crystal.ts,
# and src/components/RockShelf.tsx. Adjacent to /soil and /spring in the
# cabinet peer ring; the lattice register of the drop band, where the drop is
# water and the seed is alive.

key: rocks
component_name: RockShelf

placement:
  kind: peer
  circle: cabinet
  band: drop
  label: "the stones"
  ringAfter: seed

sigil: earth
desc: "the lattice you can hear"
cluster: nature
dark: true
home_priority: 9
ambient_profile: earth
storage_key: "objetdart:rocks:v1"

invariant: >
  a lattice — a metric (axial lengths and angles), a centering, a point
  group, and the cleavage family the group carries; every face of the room
  is that one object seen again, and the invertible map is reciprocal
  lattice → ring partials, so readLattice recovers system, centering, and
  axial ratio from the sound alone.

material: 2d-over-shader
noun: stone

domain_lib:
  name: crystal
  invariant_type: lattice

palette:
  bg:      "#05070a"
  bg2:     "#141a24"
  glow:    "#dfe7f2"
  accent:  "#f3d77a"
  accent2: "#96b2e2"
  ink:     "#eeeadb"

visual_style:
  subject: "a shelf tray of brine with faceted stones lifted out of it — each stone the Wulff hull of its own lattice"
  form_language: [SDF, hand-painted, ink-line]
  motion_character: still
  reference_notes:
    - "a nineteenth-century mineralogy cabinet plate: seven or eight ideal habits lined up on a dark ground"
    - "a jeweler's tray under a single warm lamp, its rim rimmed with creeping salt"
    - "each stone is a literal polyhedron with visible flat-shaded facet edges, not a rendered blob"
  mood: "cabinet-quiet, jeweled, the tray waiting; each stone alone with its symmetry"
  gesture_feedback_style: "a tap rings the full spectrum of the stone's reciprocal lattice; a drag turns it in place while its lattice comes with it; a flick cleaves along the nearest allowed plane and both halves keep their mass"

verbs_answered:
  - tap
  - dwell
  - ceremony
  - drag
  - flick
  - twist
  - twist3
  - tap3
  - drag3
  - hold3
  - scrub
  - drum
  - arrows
  - tilt
  - shake
  - knock
  - flip

guide:
  title: "the lattice you can hear"
  scale: >
    the drop band — a peer beside the drop and the seed, and the stratum
    the ground and the peak both open onto.
  essence: >
    a tray of brine with stones still coming out of it — salt, quartz,
    calcite, pyrite, zircon, topaz — each shaped by its own crystal
    lattice, split along its own cleavage planes, ranked by its own
    hardness, and ringing with the partials that lattice allows.
  moves:
    - "tap a stone → it rings its own ring; the partial ratios are its allowed reflections"
    - "tap the wet dark → a grain of salt, and the brine takes a little more into it"
    - "drag a stone → turns it in your fingers, facets sweeping the light, and it keeps the turn when you let go"
    - "flick across a stone → it cleaves, and the fracture follows the nearest lattice plane rather than your line"
    - "hold on the wet dark → plants a nucleus and feeds it from the tray for as long as you hold"
    - "hold a nodule to the ceremony tier → the geode opens and its lining faces out"
    - "three-finger drag → how much the brine is holding; drag it far enough down and the stones go back into solution"
    - "three-finger hold → the clock runs at a quarter; three-finger twist → the season, the brine run hot then cold"
    - "three-finger tap → every stone on the shelf rings at once"
    - "twist → raises the lattice lens: the ring drawn as its reflections, the cleavage traces across the stone"
    - "scrub → stirs the brine, driving the solvent off so it holds more"
    - "tilt / shake / knock / flip (once invited) → the light leans, salt snows out of solution, the tray rings, the room sleeps"
    - "arrows → step between stones · enter → ring one · held enter → feed it, then split it · esc → lower the lens"
  finds:
    - "a face-centred salt and a primitive pyrite are both cubes and do not sound alike — half of salt's reflections are missing, and you can hear the gap"
    - "turning a stone turns which cleavage plane your strike can find; the same strike on the same stone always finds the same plane"
    - "a cleaved half holds exactly the mass it took with it, so two small stones ring higher than the one they came from"
    - "stones left lying against each other do not stay equal — the larger quietly takes the smaller, and what it eats it speaks lower for"
    - "a grooved stone loses its clarity as well as its polish: you can see the scratch and hear the ring go dull"
  keeps: "every stone, its species and seed and the cuts made in it, and how much is still dissolved in the tray"

# ——— the "alive at rest" / "make and unmake" / "haptics" contract ————————
# Round-trip-derived from src/components/RockShelf.tsx and src/lib/crystal.ts.
# Stones are the countable object — MAX_STONES=14 through `settleStones` —
# born by dwelling on the wet dark (a nucleus is planted and grows by
# `growStep` while held; brine visibly draws down as it does), split by a
# flick (a cleavage plane the lattice actually names), retired by ceremony
# (opens the nodule as a geode — a real touch-reachable transformation)
# or by starvation (a smaller stone next to a larger loses to it slowly).
# Persistence via the room's own storage_key.
life:
  population:
    objects:
      - noun: stone
        max_count: 14                              # MAX_STONES from @/lib/crystal
        state_shape: "species, seed, nx, ny, yaw, pitch, spin, solid, LatticeState (system, centering, a, b, c, α, β, γ, pointGroup, cleavage), cuts (up to MAX_CUTS=3), geode/lined/scratched"
        lifecycle: "born under dwell on the wet dark (plant() seeds a nucleus and feeds it from the tray while held) → grows while pressing (feed()) → cleaved by flick along the nearest allowed lattice plane (cleave() splits into two stones, both keep their mass) → geode nodule opens at ceremony (hold tier 3 → cleave with wasGeode → the lining faces out) → ground down by a neighbour under drag (scratch()) → retires via <LetGo> (dissolves back to brine) or when settleStones shifts it out"
        persistence: localStorage
        creates_via_verb: dwell
        retires_via: [LetGo, flick, neighbour-scratch, MAX_STONES-overflow]
        implementation_hint: "inline array (stonesRef) + createIdleWriter to STORE_KEY"
  breath:
    period_seconds: 7
    reads:
      - u_breath                                   # shader-side name (snake-case, not the canonical `uBreath`) — the mechanical check skips breath_wired for this room by design
    behavior_at_rest: "the brine shader reads `u_breath` at `lamp = exp(-ld * 2.1) * (0.72 + 0.28 * u_breath)` and the JS-side draw pass mixes it into a twinkle floor for opened geodes — the raking lamp is quietly breathing on the shared 7s clock."
  glimmer:
    after_idle_ms: 20000
    visual: "after ~20s of quiet the loop picks one stone (glimmerStone index cycles by hashed time) and lifts its `lit` by 0.45 — one facet catches the raking light for a beat."
  # Rocks uses raw attachGestures with a per-tier branch inside the `hold`
  # handler rather than a `useMemo<RoomVoice>` with a discrete `ceremony:`
  # method — the ceremony act (opening the geode at tier 3) IS in the code
  # but the mechanical check cannot see it and FAILs. Real drift, not a
  # mislabel; the manifest declares it here so the follow-up is visible.
  haptics_grammar:
    tap: tap                # stone tap and wet-dark tap → haptics.tap()
    dwell: ripple           # plant nucleus → haptics.ripple(0.4)
    ceremony: bloom         # tier-3 release on held stone → haptics.bloom() (and inside cleave() when wasGeode)
    drag: tap               # stone turning under drag → haptics.tap() on the facet-catches-light beat
    flick: detent           # cleave() → haptics.detent()
    twist: lens             # lens snap on twist end → haptics.lens()
    twist3: detent          # season detent on twist(3) release → haptics.detent()
    tap3: ripple            # tutti() → haptics.ripple(0.4)
    scrub: ripple           # scrub the brine → haptics.ripple(0.3)
    knock: detent           # vessel knock → haptics.detent()
    shake: chop             # vessel shake → haptics.chop()
  make_unmake:
    letgo_clears_population: true                  # LetGo returns all stones to solution (visibly dissolves the tray back to brine)
    ceremony_is: "opens the tracked nodule as a geode — cleave with wasGeode faces the lining out, the stone becomes a hollow ringing thing kept between visits (tier-3 branch inside the hold handler, not a discrete `ceremony:` method — the mechanical test cannot see it and FAILs; real drift for a follow-up)"

shader_intent: >
  a shelf-level view of the tray of brine with stones coming out of it.
  each stone is a per-instance SDF whose habit is the Wulff hull of the
  reciprocal-lattice family the domain module reports — a cubic salt is a
  literal cube, a hexagonal quartz a prism, and every fracture follows a
  lattice plane. the wet dark below is a shallow depth column from `bg` to
  `bg2` with a specular-reflection ripple at the brine's surface; the
  facets pick up `glow` where the light lands and `accent` where they turn
  away. `accent2` marks the mineral bloom the brine crusts along its
  edges; `ink` is the lens line colour. the invariant the shader must
  respect: a stone's outline is exactly its lattice's Wulff hull — no
  hand-drawn silhouettes.

domain_intent: >
  write `src/lib/crystal.ts` around one `LatticeState = { system, centering,
  a, b, c, alpha, beta, gamma, pointGroup, cleavage }` per stone. the
  load-bearing invertible map is reciprocal → partials: `partialsFor(state)`
  emits the sorted magnitudes of the allowed reciprocal-lattice vectors
  and `readLattice(partials)` recovers the system and axial ratio.
  `growStep(state, dtSec, brine)` is an analytic exponential-decay pull on
  the pocket of solution, so the same habit reaches the same shape at any
  rate. `cleavageAt(state, ray)` returns the nearest cleavage-orbit plane,
  never an arbitrary cut. `speciesFromRing(partials)` names the mineral.
  no DOM, no audio, no `Math.random`, no `Date.now`.

verb_intent: >
  `tap` on a stone rings its `partialsFor(state)` — a whole spectrum in one
  gesture. `tap` on the wet dark seeds a grain of salt at that point.
  `dwell` on the wet dark plants a nucleus and pulls mass out of the brine
  under it while held. `ceremony` opens the tracked nodule as a geode and
  writes its liner out. `drag` on a stone turns it — a rotation on its own
  axis that keeps its facet-count and its lattice; the drag angle sticks
  when let go. `flick` splits the stone along the nearest cleavage plane
  via `cleavageAt`. `scrub` stirs the brine, raising its solute limit.
  `drag3` writes into the brine's saturation; too far and stones dissolve.
  `twist3` turns the season, heat and cold pulled through the brine.
  `hold3` slows the room clock. `tap3` rings every stone on the shelf at
  once. `twist` (two-finger) raises the lattice lens. `arrows` step between
  stones; enter rings; held enter feeds and splits; escape lowers the lens.
  `tilt`, `shake`, `knock`, `flip` lean the tray, jostle the brine, ring
  the tray, and sleep the room. every timing constant comes from
  `gesture/core.ts`.

chrome:
  travel: true
  peers: true
