# /marsh — a wetland with standing water, reeds, and biofilm.
#
# Peer of the drop band, cabinet ring, ringAfter root. So the twist order
# extends: … → geyser → pebble → root → marsh → coin → … . Where /spring is
# a two-cell hydraulic ledger and /root is a directed tree, /marsh is the
# FIELD — a shallow standing-water surface with reed cores anchored at
# seed points, biofilm mats spread across the surface, and dissolved oxygen
# diffusing across the whole layer. Fresh invariant type: **field** — a
# continuous scalar field (dissolved oxygen) over the water surface, with
# reeds as discrete anchor points that produce it via photosynthesis and
# biofilm patches that consume it.
#
# The sigil is "aphros" — the reef used "growth", but here the water at
# the surface is the load-bearing register; the marsh is closer to foam
# than to strict growth. Cabinet ring peer with an aphros sigil reads
# naturally against /aphros (the shore's foam).

key: marsh

placement:
  kind: peer
  circle: cabinet
  band: drop
  label: "the marsh"
  ringAfter: root

sigil: aphros
desc: "the wetland, breathing between reeds"
cluster: nature
dark: true
home_priority: 9
ambient_profile: aphros
storage_key: "objetdart:marsh:v1"

invariant: >
  a continuous scalar field of dissolved oxygen O(x, y) ∈ [0, 1] over a
  shallow standing-water surface, with a small set of reed cores anchored
  at discrete points that PRODUCE oxygen via photosynthesis, and biofilm
  mats that CONSUME it. every closed-form advance the field diffuses
  laterally (heat-equation with a small conductivity), reed points inject
  oxygen at rate `PROD * sunlight`, biofilm mats sink it at rate
  `CONS * mass`. the load-bearing map is OXYGEN → PITCH — a well-
  oxygenated tile rings HIGH (a fresh spring), a stagnant tile rings LOW
  (a stagnant swamp), and from the ringing alone you recover the local
  oxygen concentration.

material: 2d-over-shader
noun: reed

domain_lib:
  name: marshfield
  invariant_type: field

palette:
  bg:      "#0a1a15"
  bg2:     "#3a2818"
  glow:    "#e8dc9a"
  accent:  "#4a7a8a"
  accent2: "#c8945a"
  ink:     "#e8eee0"

visual_style:
  subject: "a hand's width of wetland from a shallow, near-water angle — a bright hazy sky above a fixed waterline, shallow water standing over a warm muddy floor, reed stalks rising out of the water with sunlit tips, and biofilm mats spread across the floor where the dissolved-oxygen field runs low"
  form_language: [SDF, value-noise-FBM, ribbon-flow, point-cloud]
  motion_character: breathing
  reference_notes:
    - "a marsh at midday: a hazy warm-gold sky over a dark wetland waterline, muddy silt floor visible through the shallow water, warm-cool oxygen crossfade painted straight over the mud"
    - "each reed is a population-layer ribbon — rooted at its base, tapering upward, swaying from the base under turbulence + wind — not a disc and not a thin uniform-driven line segment; its body is the cool accent green, its tip a bright glow highlight"
    - "biofilm mats are a second population — horizontal, irregular, value-noise-FBM patches in the warm accent2 register, their footprint literally the biofilm density field, breathing +/-20% on the shared clock"
    - "the water surface carries a Snell-like grazing highlight at the waterline plus a refracted horizontal wobble, so the mud beneath shimmers instead of sitting still under glass"
  mood: "slow, patient, breathing — the marsh is alive between taps, the reeds swaying on the shared 7s breath, the biofilm drifting"
  gesture_feedback_style: "a tap rings the local oxygen (pitch = ringHzFor(O)); a dwell plants a new reed whose height climbs while held and pushes oxygen into its neighborhood; the ceremony seals the reed at full height (kept between visits); a hard knock stirs the oxygen field — the room's touch-reachable secret redistributes stale patches"

