# /spring — a natural spring, at the drop band, next to the stones and the soil.
#
# Placement is the ordinal decision (docs/new-room.md §1). At ~10⁻³·⁵–10⁻¹·⁵ m
# a spring is a hand's width of ground where the water table breaches: the
# same section as /soil, the same lattice register as /rocks, but the material
# that comes up is *live water on the move*. It joins the cabinet ring behind
# `/soil` (`ringAfter: soil`), so the twist order stays: /drop → /seed → /rocks
# → /soil → /spring → /coin → …. That places the spring inside the drop band
# for `SITE_ROUTES`, `LATERAL_ROUTE_BANDS` and the header dropdown; a peer of
# the drop above it, of the soil the water crosses, and of the rocks the water
# is filtered through.
#
# The sigil is "growth" — "drop" was the temptation because a spring IS a
# drop that keeps coming, but /drop itself already carries that mark, and a
# spring's whole invariant is the LIVING WATER, not the drop-shaped instant.
# The growth glyph rhymes with /soil next to it in the ring and reads
# correctly for a room whose reward is the aquifer refilling under a rainy
# fortnight.

key: spring

placement:
  kind: peer
  circle: cabinet
  band: drop
  label: "the spring"
  ringAfter: soil

sigil: growth
desc: "the aquifer, ringing at its head"
cluster: nature
dark: true
home_priority: 9
ambient_profile: waves
storage_key: "objetdart:spring:v1"

invariant: >
  a two-cell hydraulic ledger — an aquifer head H(t) under the ground and a
  small pool level L(t) at the surface — with a seep between them driven by
  Darcy flow (H − L)·throat, a weir carrying the pool over its lip, and
  climate acting as recharge W and evaporation E. every ripple, ring and
  wet-halo is a lens over those two numbers and the seep flux between them.

material: 2d-over-shader
noun: seep

domain_lib:
  name: springflow
  invariant_type: ledger

palette:
  # phase-8 visual pass (data/object-compiler/audits/phase-8-spring-visual.md):
  # bg2 turns from a second teal into a real wet-ground brown, glow and
  # accent2 both brighten, so the water surface and the mineral bloom read
  # as distinct pixels instead of dark siblings of the aquifer.
  bg:      "#060a10"
  bg2:     "#2e2013"
  glow:    "#d7f2fb"
  accent:  "#3f9dc2"
  accent2: "#e3ac57"
  ink:     "#e6efe8"

visual_style:
  subject: "a hand's width of wet ground in section — air above, a wavy waterline, a pool with a wet-halo skirt around every live seep"
  form_language: [SDF, value-noise-FBM, hand-painted]
  motion_character: drifting
  reference_notes:
    - "a botanical / hydrological section illustration: air-band, waterline, pool, wet ground, dry ground"
    - "a wet-halo around each seep whose brightness IS its live flux — invert the halo and you recover the ledger"
    - "phase-8 (data/object-compiler/audits/phase-8-spring-visual.md): the guide screenshot at public/guide/spring.jpg was thin — a near-monochrome gradient — because the pool's visual bounds covered nearly the whole frame and the ground palette was dark and low-contrast; recaptured after the shader and palette rewrite"
  mood: "steady, moist, giving — the aquifer breathing under a lipped pool"
  gesture_feedback_style: "a tap fires a gaussian ring wavefront through the pool; a dwell plants a seep whose corona brightens with widening throat; the ceremony seals it at full and its halo is kept between visits"

verbs_answered:
  - tap
  - dwell
  - ceremony
  - drag
  - flick
  - twist
  - twist3
  - tap3
  - drag3
  - hold3
  - scrub
  - drum
  - arrows
  - tilt
  - shake
  - knock
  - flip

guide:
  title: "the spring — head, seep, ring"
  scale: >
    the drop band — cabinet peer behind the soil, ahead of the coin: a hand's
    width of wet ground in section, where the aquifer under it breaches and
    its water rings its own head.
  essence: >
    a two-cell hydraulic ledger — an aquifer under the ground and a small
    pool over it — with a seep between them and a lip the pool spills over.
    the water's pitch IS the head that pushed it up, so from the ringing you
    can read the depth of the water below the ground; nothing on the shelf
    is created except what the rain gives back or the sun quietly takes.
  moves:
    - "tap → a ripple, and the water rings at the local head; deep water rings low, and where the finger lands the pool answers first"
    - "dwell → plants a seep, its rate climbing the head under it; keep pressing and the seep's throat widens, drawing more of the aquifer through"
    - "ceremony (hold to the tier) → opens the seep to the aquifer at full — a small artesian rise, kept between visits"
    - "drag → the surface film slides, and the pool climbs the far edge; layers of the pool slip against each other without changing the ledger"
    - "flick → throws the standing bubble at that point — a cast bell over the water, the ring the head that shaped it"
    - "twist → raises the flow lens: H(t), L(t), the flux between, the weir line, and the pool as a barometer of the aquifer below it"
    - "twist3 → turns the year; from thaw's peak flow to summer's low, the aquifer emptying and refilling"
    - "tap3 → tutti; every seep and every bubble rings at once, one chord across the whole ledger"
    - "drag3 → the world-law: down is rain (W up), across is evaporation (E up or down)"
    - "hold3 → time dilation while held; the ledger's clock runs slow"
    - "scrub → stirs the pool from above; the surface rotates until the vorticity bleeds off through the walls"
    - "drum (two hands alternating) → the wave field between them sings its beat over the pool"
    - "arrows → walk the surface cursor; enter held plants and deepens a seep at the cursor; escape lowers the lens"
    - "tilt / shake / knock / flip (once invited) → the pool leans, the surface scatters, a struck stone rings the pool, face-down is night"
  finds:
    - "the pitch is the head, and the map is invertible — a ring of the same note twice comes from the same depth of water below"
    - "a spring left running through summer empties its aquifer; a rainy fortnight refills it and the pitch climbs by itself"
    - "two seeps within a hand's width share the same aquifer, so widening one quiets the other — the head is common"
    - "a drowned lip stops giving: raise the pool past the weir crest and the flux out of it exceeds what the seep can put in"
    - "the water's ring was in the ground before you touched it — a fortnight's absence is read off a closed-form ledger, not replayed"
  keeps: >
    the current head, the pool level, every seep with its throat and its
    ring, the season the year had reached, and the hour it was last looked
    at.

# ——— the "alive at rest" / "make and unmake" / "haptics" contract ————————
# Round-trip-derived from src/components/Spring.tsx and src/lib/springflow.ts.
# Seeps are the countable object — MAX_SEEPS=16, throat 0..MAX_THROAT=1,
# born by dwelling on the pool (plantSeep at throat 0, deepenSeep while
# held on a saturating curve), sealed at ceremony (throat = MAX_THROAT,
# sealed=true, kept between visits), retired only by LetGo. Worth noting
# for item 3: a seep once sealed cannot be individually retired by a
# ceremony over it — only <LetGo> clears the population. Persistence via
# the room's own storage_key.
life:
  population:
    objects:
      - noun: seep
        max_count: 16   # MAX_SEEPS from src/lib/springflow.ts
        state_shape: "id, nx, ny, throat (0..MAX_THROAT=1), sealed (bool), t0, phase seed"
        lifecycle: "born under dwell (plantSeep at throat 0) → throat widens on saturating curve `DWELL_THROAT_MAX * (1 - exp(-elapsed / THROAT_WIDEN_TAU_MS))` while held → sealed at ceremony (throat = MAX_THROAT, sealed=true, kept between visits) → retires only via <LetGo> (no ceremony-over-existing-seep delete — item 3 partially unmet)"
        persistence: LetGo
        creates_via_verb: dwell
        retires_via: [LetGo]
        implementation_hint: SceneObjectSpec
      # phase-8 visual pass: a second population, added so the room is a
      # population and not one object in space (test-room-depth's density
      # floor). Spawns from the seep population's own flux — no gesture verb
      # creates it.
      - noun: bubble
        max_count: 28
        state_shape: "id, nx, ny, vy (rise rate), wobbleAmp/wobbleFreq/wobblePhase, r0, popping (bool)"
        lifecycle: "born from an open seep's flux (spawn budget accumulates as fluxBright·rate·dt, deterministic, no RNG in the timing) → rises and wobbles on its own seeded sine → pops at the waterline (popping=true, presence begins the population's own graceful fade) → never persisted"
        persistence: ephemeral
        creates_via_verb: "(automatic — spawned by an active seep)"
        retires_via: ["waterline crossing", LetGo]
        implementation_hint: SceneObjectSpec
    depth_note: "the two populations share one ledger: a seep's live flux is the bubble population's only spawn source, so a wider throat visibly bubbles harder, not just brighter. Both populations write into the same instanced draw call."
  shader_layers:
    - { name: sky_and_clouds, order: 1, register: background }
    - { name: seep_wet_halo, order: 2, register: underwater+ground }
    - { name: refraction_wobble, order: 3, register: underwater }
    - { name: underwater_column, order: 4, register: pool }
    - { name: wet_ground_moisture, order: 5, register: ground }
    - { name: mineral_bloom, order: 6, register: ground }
    - { name: vignette_and_night, order: 7, register: overlay }
  breath:
    period_seconds: 7
    reads:
      - "uBreath uniform (fragment shader — air column airCol *= 0.86 + 0.14 * uBreath)"
      - "uBreath uniform (surface Snell highlight 0.85 + 0.15 * uBreath)"
      - "uBreath uniform (mineral bloom `0.6 + uBreath * 0.4`)"
    behavior_at_rest: "three visible registers ride the 7s clock: air column brightens/dims by ±14%, Snell surface highlight by ±15%, mineral bloom at the wet edge by ±40% — the pool is always visibly moving even between taps"
  glimmer:
    after_idle_ms: 20000
    visual: "one seep breathes a wider ring, alone, and nothing is said (glimmer handler picks a seep by `state.tau * 977 % state.seeps.length` and pushes a soft ripple)"
  haptics_grammar:
    tap: ripple             # ringHere → haptics.ripple(0.3 + weight * 0.35); tap-on-seep → tap
    dwell: tap              # plant() fires haptics.tap(); deepen ticks are silent by design (60ms cadence would over-vibrate)
    ceremony: bloom         # sealSeep → haptics.bloom() — the room's solemn act
    drag: null              # surface film slides — no haptic (ledger unchanged; visual+audio only)
    flick: chop             # bubble thrown → haptics.chop()
    twist: lens             # lens raise/lower → haptics.lens()
    twist3: detent          # season detent on release (year passing has no continuous grain)
    tap3: roll              # tutti → haptics.roll()
    drag3: null             # wind (rain/evap) — continuous audio-only write, no haptic per event
    hold3: null             # time dilation is a state, not a hit
    scrub: tap              # stir the pool — audio carries it, small tap on entry
    drum: tap               # drum between two zones
    knock: detent           # struck stone rings the pool → haptics.detent()
    shake: null             # scatter — writes turbulence axis, no per-event haptic
    tilt: null              # continuous accelerometer lean
    flip: null              # night toggle
    arrows: tap             # moveCursor / keyTap
  make_unmake:
    letgo_clears_population: true   # `clear` empties `state.seeps` and fires haptics.roll()
    ceremony_is: "sealing the seep at full throat — the aquifer is opened, kept between visits, a small artesian rise stays in the pool"

# ——— the three LLM slots ————————————————————————————————————————————————

shader_intent: >
  paint one hand-width of wet ground in section, seen from the front. the
  top third is air, with a faint fbm cloud streak riding the horizon; below
  it the ground meets a SHALLOW pool at a wavy waterline — the pool is a
  band, not the whole lower frame, so real wet ground reads both above the
  waterline (the bank) and below the pool floor (down toward the aquifer).
  in the pool: the surface highlight is a low-angle Snell reflection of the
  sky palette, a small horizontal refraction wobble bends everything below
  the waterline, an fbm caustic shimmer tints the water glow, and ripples
  propagate as gaussian wavefronts from every live seep and from pointer
  taps (all passed as a `vec4[24]` uniform). the underwater dark is a depth
  gradient from a lifted shallow tone down to `bg` (the true aquifer dark) —
  `bg2` no longer doubles as pool depth. in the ground: horizontal moisture
  bands, wettest at the waterline/pool floor and drying with distance from
  it in EITHER direction — `mix(DRY, bg2, moisture)`, so wet ground reads
  dark and rich, dry ground pale and dusty. the wet halo around a seep is
  read in BOTH registers (pool and ground) and is exactly as bright as its
  live flux the domain module reports (invert the halo, recover the local
  flux). every seep and every bubble is drawn as an SDF disc with an
  additive corona through the shared instanced pass
  (`src/lib/scene/population-layer.ts` and `src/lib/webgl/stage.ts`); no
  `createRadialGradient`, no per-frame allocation. a mineral bloom at the
  pool edge is a value-noise FBM patch gated over the moisture field —
  amplitude monotone in moisture, same invertible shape as the flux→corona
  map, so the fbm only says WHERE a patch draws, never rescales it. palette
  registers: `bg` is the deep aquifer dark, `bg2` is a real wet-ground brown
  (dark and rich when saturated), `glow` is the sunlit water surface (the
  load-bearing highlight, and the bubble's own hue), `accent` is the cold
  register (water in motion), `accent2` is the warm register (mineral bloom
  at the wet edge), `ink` is readable text over the darkest tile. the twist
  lens is a second render path: H(t) and L(t) drawn as bars, the flux curve
  between them, the weir line, every seep's throat as a labelled tick — the
  ledger read back off the water.

domain_intent: >
  write `src/lib/springflow.ts` around one exported `SpringState = { H, L,
  seeps, tau }`. H is aquifer head (m), L is pool level (m), tau is seconds
  of maturity. climate `Climate = { warmth, wet }` drives two linear
  responses: recharge `W(warmth, wet)` and evaporation `E(warmth, wet)`,
  each bounded, so the drowned corner of the weather is where the pool
  drowns its own lip rather than the fastest spring in the room. the rate
  laws are the two-cell ledger:
      dH/dt = W − k_seep · (H − L) · Σ throat_i
      dL/dt = k_seep · (H − L) · Σ throat_i − E − Q_lip
      Q_lip = c_w · max(0, L − L_lip)^(3/2)
  when Σ throat is stable between visits the coupled ODEs have a closed-form
  solution (two-eigenvalue linear system), so `advanceExact(state, seconds,
  climate)` is one matrix exponential per stable interval, never a Euler
  catch-up loop. cap elapsed at `MAX_ELAPSED_S` = 14 days so a month away is
  not a century of drift. the LOAD-BEARING INVERTIBLE MAP is HEAD → PITCH:
  `ringHzFor(head)` is a monotone function of H (`f(head) = base·2^(H/scale)`),
  and `headForRingHz(hz)` exactly inverts it. from the sound alone you
  recover the head; the test pins the round-trip across seeds and heads.
  export a bounded scatter (`SCATTER_STEPS`) that reports its budget, a
  deterministic `mulberry32(hashSeed(storageKey, index))` seed for every
  seep's phase, and a `totalWater(state)` observable so the test can check
  conservation across a plant, a decay and a season turn. no DOM, no audio,
  no `Math.random`, no `Date.now`.

verb_intent: >
  every handler reads `SpringState` from a stable `apiRef` and forwards to a
  method on `SpringApi` (mirrors `src/components/SoilGround.tsx` around line
  375's `voiceRef = useRef<RoomVoice>(...)` pattern). `tap` rings the water
  at the finger, pitch derived from the local head via `ringHzFor` — a
  smaller `e.intensity` rings a smaller ripple, and the pitch alone tells
  the head, so a tap at the deep pool never sounds like a tap at the wet
  edge. `dwell` plants a seep at the finger with throat 0; while held, the
  throat widens by an increasing but saturating function of `e.elapsed`, so
  a two-second dwell widens twice as far as a one-second dwell but a
  ten-second dwell only widens 1.5× as far as five. `ceremony` seals the
  seep at full throat and writes it to the shared `world.ts` bus so it
  keeps between visits. `drag` slides the surface film — a linear pool-tilt
  proportional to `e.dx`, `e.dy`, the ledger unchanged. `flick` throws the
  standing bubble at that point (mass-conserving; the bubble carries the
  ring pitch it had). `scrub` (a finger circling) writes an angular
  velocity into the surface vortex, which decays back to zero on its own
  clock. `drum` (two hands alternating) beats the wave field between the
  two contact zones. `twist` raises the flow lens; a `tap` with `e.fingers
  === 2` (step back) lowers it. `drag3` writes into `Climate` — `e.dy` is
  rate-of-change on W (recharge; down is rain), `e.dx` is rate-of-change on
  E (evaporation), both bounded so a maximal drag can never take W below
  zero or E above the sun's own limit. `twist3` moves the year through
  `Climate`'s combined `warmth` axis, and `advanceExact` catches the ledger
  up on the closed form. `hold3` slows the room's clock (a real dt scale,
  not an animation trick). `tap3` (tutti) rings every seep at once — one
  chord read from the whole ledger. the vessel: `tilt` leans the surface
  highlight, `shake` scatters the pool (an event that decays back), `knock`
  rings the pool as a struck stone — the pitch is `ringHzFor(H)` again, and
  the audio path is `spectralRegisterFor(s)` for the band's register.
  `flip` is night; the surface highlight goes to a moon register and the
  ledger keeps its closed-form clock. `arrows` walk a surface cursor; enter
  held is a keyboard dwell; escape lowers the lens. no room-local timing
  constants — every threshold is from `gesture/core.ts`.

chrome:
  travel: true
  peers: true
