name: Native CI

on:
  pull_request:
    paths:
      - apps/native/**
      - packages/**
      - scripts/native/**
      - tsconfig.json
      - .gitignore
      - package.json
      - package-lock.json
      - .github/workflows/native-ci.yml
  push:
    branches: [main]
    paths:
      - apps/native/**
      - packages/**
      - scripts/native/**
      - tsconfig.json
      - .gitignore
      - package.json
      - package-lock.json
      - .github/workflows/native-ci.yml

jobs:
  workspace:
    name: Native workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.x
          cache: npm
      - run: npm ci
      - run: npm run native:check
      - run: npm --workspace @objet/native-universe exec expo -- export --platform ios --output-dir /tmp/objet-native-export
  prebuild:
    name: Native iOS prebuild
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.x
          cache: npm
      - run: npm ci
      - run: npm run native:host
      - run: npm run native:prebuild
      - run: find apps/native/ios -type f ! -path '*/project.pbxproj' -print0 | sort -z | xargs -0 shasum > /tmp/objet-ios-first.sha
      - run: sed -E 's/[A-F0-9]{24}/OBJECT_ID/g' apps/native/ios/objetdart.xcodeproj/project.pbxproj > /tmp/objet-ios-first.pbxproj
      - run: npm run native:prebuild
      - run: find apps/native/ios -type f ! -path '*/project.pbxproj' -print0 | sort -z | xargs -0 shasum > /tmp/objet-ios-second.sha
      - run: sed -E 's/[A-F0-9]{24}/OBJECT_ID/g' apps/native/ios/objetdart.xcodeproj/project.pbxproj > /tmp/objet-ios-second.pbxproj
      - run: diff --unified /tmp/objet-ios-first.sha /tmp/objet-ios-second.sha
      - run: diff --unified /tmp/objet-ios-first.pbxproj /tmp/objet-ios-second.pbxproj
      - run: cd apps/native/ios && pod install
      - run: xcodebuild -workspace apps/native/ios/objetdart.xcworkspace -scheme objetdart -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
